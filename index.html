<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azon — Вақти Намоз</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .active-tab { color: #10b981 !important; } /* Зеленый без полоски сверху */
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <div id="city-modal" class="modal">
        <div class="glass w-full max-w-sm p-6 rounded-[2.5rem]">
            <h2 class="text-xl font-bold mb-4 text-emerald-500 text-center">Интихоби макон</h2>
            <div class="grid grid-cols-1 gap-2 max-h-64 overflow-y-auto mb-4 pr-2">
                <button onclick="setCity(38.53, 68.78, 'Душанбе')" class="p-3 bg-white/5 rounded-xl text-left hover:bg-emerald-500/20">Душанбе</button>
                <button onclick="setCity(40.28, 69.62, 'Хуҷанд')" class="p-3 bg-white/5 rounded-xl text-left hover:bg-emerald-500/20">Хуҷанд</button>
                <button onclick="setCity(37.83, 68.85, 'Бохтар')" class="p-3 bg-white/5 rounded-xl text-left hover:bg-emerald-500/20">Бохтар</button>
                <button onclick="setCity(40.12, 70.63, 'Исфара')" class="p-3 bg-white/5 rounded-xl text-left hover:bg-emerald-500/20">Исфара</button>
                <button onclick="setCity(37.49, 71.55, 'Хоруғ')" class="p-3 bg-white/5 rounded-xl text-left hover:bg-emerald-500/20">Хоруғ</button>
                <button onclick="setCity(38.52, 69.22, 'Ҳисор')" class="p-3 bg-white/5 rounded-xl text-left hover:bg-emerald-500/20">Ҳисор</button>
            </div>
            <button onclick="updateLocationGPS()" class="w-full bg-emerald-600 p-4 rounded-2xl font-bold flex items-center justify-center">
                <i class="fas fa-location-arrow mr-2"></i> Муайянкунии GPS
            </button>
        </div>
    </div>

    <header class="p-6 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black text-emerald-500 tracking-tighter">AZON</h1>
            <p class="text-[10px] uppercase tracking-widest text-slate-400 city-display" onclick="document.getElementById('city-modal').classList.add('active')">Интихоби шаҳр <i class="fas fa-chevron-down ml-1"></i></p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-slate-500 uppercase">То намози оянда:</p>
            <p id="countdown" class="text-xl font-mono font-bold text-emerald-400">00:00:00</p>
        </div>
    </header>

    <main class="px-4">
        
        <section id="tab-times" class="tab-content active">
            <div id="prayer-list" class="space-y-3">
                </div>
        </section>

        <section id="tab-learn" class="tab-content">
            <h2 class="text-2xl font-bold mb-4 text-emerald-500">Омӯзиши Намоз</h2>
            <div class="grid gap-3">
                <div class="glass p-4 rounded-2xl" onclick="showLearn('fajr')">
                    <div class="flex justify-between items-center">
                        <span class="font-bold">Намози Бамдод</span>
                        <span class="text-xs text-emerald-500">4 ракъат <i class="fas fa-chevron-right ml-2"></i></span>
                    </div>
                </div>
                <div class="glass p-4 rounded-2xl" onclick="showLearn('dhuhr')">
                    <div class="flex justify-between items-center">
                        <span class="font-bold">Намози Пешин</span>
                        <span class="text-xs text-emerald-500">10 ракъат <i class="fas fa-chevron-right ml-2"></i></span>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-dua" class="tab-content">
            <h2 class="text-2xl font-bold mb-4 text-emerald-500">Дуоҳои муҳим</h2>
            <div class="space-y-3">
                <div class="glass p-4 rounded-2xl">
                    <p class="text-xs text-emerald-500 mb-1 font-bold">Дуои субҳ</p>
                    <p class="text-sm">«Алҳамдулиллоҳиллазӣ аҳёно баъда мо амотано ва илайҳин-нушур»</p>
                </div>
                <div class="glass p-4 rounded-2xl">
                    <p class="text-xs text-emerald-500 mb-1 font-bold">Дуои волидайн</p>
                    <p class="text-sm">«Рабби-рҳамҳумо камо раббаёнӣ сағиро»</p>
                </div>
            </div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass py-4 flex justify-around rounded-t-[2.5rem] z-50 border-none">
        <button onclick="showTab('times')" id="btn-times" class="nav-btn active-tab flex flex-col items-center">
            <i class="fas fa-clock-rotate-left text-xl"></i>
            <span class="text-[9px] mt-1 font-bold uppercase">Вақт</span>
        </button>
        <button onclick="showTab('learn')" id="btn-learn" class="nav-btn text-slate-500 flex flex-col items-center">
            <i class="fas fa-book-quran text-xl"></i>
            <span class="text-[9px] mt-1 font-bold uppercase">Омӯзиш</span>
        </button>
        <button onclick="showTab('dua')" id="btn-dua" class="nav-btn text-slate-500 flex flex-col items-center">
            <i class="fas fa-hands-praying text-xl"></i>
            <span class="text-[9px] mt-1 font-bold uppercase">Дуоҳо</span>
        </button>
    </nav>

    <script>
        let currentTimings = {};
        const prayerNames = {Fajr:'Бамдод', Sunrise:'Вохӯрӣ', Dhuhr:'Пешин', Asr:'Аср', Maghrib:'Шом', Isha:'Хуфтан'};

        async function init() {
            const saved = localStorage.getItem('azon_loc');
            if(!saved) {
                document.getElementById('city-modal').classList.add('active');
            } else {
                const l = JSON.parse(saved);
                fetchPrayerTimes(l.lat, l.lon, l.name);
            }
            setInterval(updateTimer, 1000);
        }

        function setCity(lat, lon, name) {
            localStorage.setItem('azon_loc', JSON.stringify({lat, lon, name}));
            document.getElementById('city-modal').classList.remove('active');
            fetchPrayerTimes(lat, lon, name);
        }

        function updateLocationGPS() {
            navigator.geolocation.getCurrentPosition(p => {
                setCity(p.coords.latitude, p.coords.longitude, "Макони шумо");
            });
        }

        async function fetchPrayerTimes(lat, lon, name) {
            document.querySelector('.city-display').innerHTML = `${name} <i class="fas fa-chevron-down ml-1"></i>`;
            const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=3`);
            const json = await res.json();
            currentTimings = json.data.timings;
            renderPrayers();
        }

        function renderPrayers() {
            const list = document.getElementById('prayer-list');
            list.innerHTML = "";
            Object.entries(prayerNames).forEach(([id, name]) => {
                const isNotify = localStorage.getItem('notify_'+id) !== 'false';
                list.innerHTML += `
                    <div class="glass p-5 rounded-[2rem] flex justify-between items-center">
                        <div class="flex items-center">
                            <button onclick="toggleNotify('${id}')" class="mr-4 ${isNotify ? 'text-emerald-500' : 'text-slate-600'}">
                                <i class="fas ${isNotify ? 'fa-bell' : 'fa-bell-slash'}"></i>
                            </button>
                            <span class="font-bold">${name}</span>
                        </div>
                        <span class="text-2xl font-black ${id === 'Fajr' ? 'text-emerald-400' : 'text-white'}">${currentTimings[id]}</span>
                    </div>
                `;
            });
        }

        function toggleNotify(id) {
            const status = localStorage.getItem('notify_'+id) !== 'false';
            localStorage.setItem('notify_'+id, !status);
            renderPrayers();
        }

        function updateTimer() {
            if(!currentTimings.Fajr) return;
            const now = new Date();
            // Логика поиска ближайшего намаза и расчет разницы (упрощенно)
            // Здесь будет код сравнения времен
            document.getElementById('countdown').innerText = new Date().toLocaleTimeString('ru-RU'); // Заглушка для примера
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('tab-'+id).classList.add('active');
            document.getElementById('btn-'+id).classList.add('active-tab');
        }

        init();
    </script>
</body>
</html>
