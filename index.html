<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Isfara FM - 93.9FM РАДИОИ ИСФАРА</title>
    <!-- Отключаем кэширование -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- Иконки и шрифты -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========== ОСНОВНЫЕ СТИЛИ ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7a1cff;
            --secondary: #9d4dff;
            --accent: #00aaff;        /* Неоново-голубой */
            --accent-glow: #00ccff;
            --text: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-hover: rgba(255, 255, 255, 0.15);
        }

        body {
            background: linear-gradient(135deg, #2a0b5e 0%, #4a1b9e 30%, #7a1cff 70%, #9d4dff 100%);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            position: relative;
            font-size: 16px;
            line-height: 1.5;
        }

        /* Фоновый эффект */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.4;
            background: 
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(122,28,255,0.2) 0%, transparent 40%);
            animation: gradientFloat 20s ease infinite alternate;
        }

        @keyframes gradientFloat {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(1deg); }
        }

        /* Контейнер для контента */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* ========== ШАПКА ========== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        .logo-text h1 {
            font-size: clamp(18px, 4vw, 22px);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            line-height: 1.2;
        }

        .logo-text p {
            font-size: 12px;
            color: #FFD700;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Кнопка меню */
        .menu-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            width: 45px;
            height: 45px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-btn:hover {
            background: var(--glass-hover);
            transform: rotate(90deg);
        }

        /* ========== БОКОВОЕ МЕНЮ ========== */
        .side-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 350px;
            height: 100%;
            background: rgba(42, 11, 94, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            padding: 80px 20px 30px;
            overflow-y: auto;
            box-shadow: -5px 0 30px rgba(0,0,0,0.5);
        }

        .side-menu.active {
            right: 0;
        }

        .menu-header {
            font-size: 22px;
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 25px;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .menu-item:hover {
            background: rgba(0, 170, 255, 0.2);
            border-color: var(--accent);
            transform: translateX(-5px);
        }

        .menu-item i {
            color: var(--accent);
            font-size: 20px;
            width: 25px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* ========== ОСНОВНОЙ КОНТЕНТ ========== */
        .main-content {
            padding: 20px 15px 30px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Плеер */
        .player-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .vinyl-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: rotate 15s linear infinite;
            animation-play-state: paused;
            filter: drop-shadow(0 0 20px rgba(0,170,255,0.3));
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .wave-animation {
            position: absolute;
            bottom: -20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 3px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .wave-animation.active {
            opacity: 1;
        }

        .wave-bar {
            width: 4px;
            height: 20px;
            background: var(--accent);
            border-radius: 2px;
            animation: wave 1.2s ease-in-out infinite;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 25px; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 30px; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 35px; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 30px; }
        .wave-bar:nth-child(6) { animation-delay: 0.5s; height: 25px; }
        .wave-bar:nth-child(7) { animation-delay: 0.6s; height: 20px; }

        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.5); }
        }

        .player-btn {
            width: 100%;
            max-width: 300px;
            height: 60px;
            margin: 20px auto 10px;
            background: linear-gradient(135deg, var(--accent), #0088cc);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0,170,255,0.5);
        }

        .player-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0,170,255,0.8);
        }

        .status-text {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            margin-top: 10px;
        }

        /* Блоки погоды и валют */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }

        .info-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px 15px;
            transition: all 0.3s;
        }

        .info-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0,170,255,0.2);
        }

        .card-title {
            font-size: 18px;
            color: var(--accent);
            margin-bottom: 15px;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .weather-info {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .weather-details {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }

        .currency-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 16px;
        }

        .currency-item:last-child {
            border-bottom: none;
        }

        .currency-code {
            font-weight: 600;
            color: var(--accent);
        }

        /* Новости */
        .news-section {
            margin: 30px 0;
            padding: 25px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        .section-title {
            font-size: 22px;
            color: var(--accent);
            margin-bottom: 20px;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .news-card {
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s;
        }

        .news-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .news-card i {
            color: var(--accent);
            font-size: 24px;
            margin-bottom: 10px;
        }

        .news-card h4 {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .news-card p {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .news-btn {
            display: inline-block;
            padding: 10px 25px;
            background: transparent;
            border: 2px solid var(--accent);
            border-radius: 25px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .news-btn:hover {
            background: var(--accent);
            color: white;
        }

        /* Рекламный блок */
        .ad-section {
            margin: 30px 0;
            padding: 25px 20px;
            background: linear-gradient(135deg, rgba(0,170,255,0.1), rgba(122,28,255,0.2));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid var(--accent);
            border-radius: 20px;
            text-align: center;
        }

        .ad-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 20px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(0,170,255,0.5);
        }

        .ad-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .feature {
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
        }

        .feature i {
            font-size: 28px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .feature p {
            font-size: 14px;
            font-weight: 600;
        }

        .ad-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            padding: 12px 30px;
            background: var(--accent);
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            background: #0088cc;
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--accent);
        }

        .btn-secondary {
            padding: 12px 30px;
            background: transparent;
            border: 2px solid var(--accent);
            border-radius: 25px;
            color: var(--accent);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary:hover {
            background: var(--accent);
            color: white;
        }

        /* Соцсети */
        .social-section {
            margin: 30px 0;
            text-align: center;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            transition: all 0.3s;
            text-decoration: none;
        }

        .social-icon:hover {
            transform: translateY(-5px) scale(1.1);
        }

        .telegram { background: #0088cc; }
        .instagram { background: linear-gradient(45deg, #405DE6, #833AB4, #E1306C); }
        .youtube { background: #FF0000; }
        .whatsapp { background: #25D366; }

        /* ========== КОНТЕНТ-СЕКЦИИ (меню) ========== */
        .content-section {
            display: none;
            padding: 20px 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        .content-section.active {
            display: block;
        }

        /* Команда и Партнёры (карточки) */
        .team-grid, .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .team-card, .partner-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            transition: all 0.3s;
        }

        .team-card:hover, .partner-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
        }

        .team-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid var(--accent);
        }

        .team-card h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .team-card p {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .partner-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: brightness(0) invert(1);
        }

        .partner-card h3 {
            font-size: 16px;
        }

        /* Расписание */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 20px 0;
        }

        @media (min-width: 768px) {
            .days-grid {
                grid-template-columns: repeat(7, 1fr);
            }
        }

        .day-btn {
            padding: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .day-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .program-list {
            margin-top: 20px;
        }

        .program-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--glass-bg);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .program-time {
            color: var(--accent);
            font-weight: 600;
        }

        /* ========== ФУТЕР ========== */
        footer {
            text-align: center;
            padding: 20px 15px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border);
            font-size: 14px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        }

        .footer-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        /* Диалог выхода */
        .exit-dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(42, 11, 94, 0.98);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--accent);
