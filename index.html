<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azon — Вақти Намоз</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .active-tab { color: #10b981 !important; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .btn-press:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen pb-32 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-900/20 via-slate-950 to-black">

    <div id="city-modal" class="modal">
        <div class="glass w-full max-w-sm p-6 rounded-[2.5rem]">
            <h2 class="text-xl font-black mb-4 text-emerald-500 text-center">Интихоби макон</h2>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button onclick="setCity(38.53, 68.78, 'Душанбе')" class="p-3 bg-white/5 rounded-2xl text-sm hover:bg-emerald-500/20 border border-transparent hover:border-emerald-500/30">Душанбе</button>
                <button onclick="setCity(40.28, 69.62, 'Хуҷанд')" class="p-3 bg-white/5 rounded-2xl text-sm hover:bg-emerald-500/20 border border-transparent hover:border-emerald-500/30">Хуҷанд</button>
                <button onclick="setCity(37.83, 68.85, 'Бохтар')" class="p-3 bg-white/5 rounded-2xl text-sm hover:bg-emerald-500/20 border border-transparent hover:border-emerald-500/30">Бохтар</button>
                <button onclick="setCity(40.12, 70.63, 'Исфара')" class="p-3 bg-white/5 rounded-2xl text-sm hover:bg-emerald-500/20 border border-transparent hover:border-emerald-500/30">Исфара</button>
                <button onclick="setCity(38.52, 69.22, 'Ҳисор')" class="p-3 bg-white/5 rounded-2xl text-sm hover:bg-emerald-500/20 border border-transparent hover:border-emerald-500/30">Ҳисор</button>
                <button onclick="setCity(38.51, 68.99, 'Ваҳдат')" class="p-3 bg-white/5 rounded-2xl text-sm hover:bg-emerald-500/20 border border-transparent hover:border-emerald-500/30">Ваҳдат</button>
            </div>
            <button onclick="updateLocationGPS()" class="w-full bg-emerald-600 p-4 rounded-2xl font-bold flex items-center justify-center btn-press">
                <i class="fas fa-location-arrow mr-2"></i> GPS (Автоматӣ)
            </button>
            <button onclick="closeModal('city-modal')" class="w-full mt-2 p-2 text-slate-500 text-sm">Бастан</button>
        </div>
    </div>

    <div id="info-modal" class="modal">
        <div class="glass w-full max-w-lg p-6 rounded-[2.5rem] relative">
            <button onclick="closeModal('info-modal')" class="absolute top-4 right-6 text-2xl text-slate-500">&times;</button>
            <div id="modal-content" class="mt-4"></div>
        </div>
    </div>

    <header class="p-6 flex justify-between items-end">
        <div>
            <h1 class="text-4xl font-black text-emerald-500 tracking-tighter">AZON</h1>
            <div onclick="openCityModal()" class="flex items-center gap-1 text-slate-400 mt-1 cursor-pointer">
                <i class="fas fa-location-dot text-[10px] text-emerald-500"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest city-display">Интихоб...</span>
            </div>
        </div>
        <div class="text-right">
            <p class="text-[10px] font-bold text-slate-500 uppercase">Намози оянда:</p>
            <p id="next-prayer-timer" class="text-lg font-black text-emerald-400">00:00:00</p>
        </div>
    </header>

    <main class="px-4">
        
        <section id="tab-times" class="tab-content active">
            <div class="glass rounded-[2rem] p-5 mb-6 border-l-4 border-emerald-500">
                <p id="daily-hadith" class="text-sm font-medium italic text-slate-200">...</p>
                <p id="hadith-source" class="text-[10px] text-emerald-600 mt-2 font-bold uppercase tracking-tighter"></p>
            </div>
            <div id="prayer-list" class="space-y-3"></div>
        </section>

        <section id="tab-learn" class="tab-content">
            <h2 class="text-2xl font-black mb-6">Тарзи хондани Намоз</h2>
            <div class="grid gap-3" id="learn-list"></div>
        </section>

        <section id="tab-dua" class="tab-content">
            <h2 class="text-2xl font-black mb-6">Дуоҳои дароз ва муҳим</h2>
            <div class="space-y-4" id="dua-list"></div>
        </section>

        <section id="tab-extra" class="tab-content">
            <div class="flex flex-col items-center justify-center pt-8">
                <div class="relative w-72 h-72 flex items-center justify-center">
                    <svg class="absolute inset-0 w-full h-full -rotate-90">
                        <circle cx="144" cy="144" r="130" stroke="currentColor" stroke-width="8" fill="transparent" class="text-slate-800" />
                        <circle id="tasbeh-progress" cx="144" cy="144" r="130" stroke="currentColor" stroke-width="8" fill="transparent" stroke-dasharray="816" stroke-dashoffset="816" class="text-emerald-500 transition-all duration-300" />
                    </svg>
                    <div class="text-center">
                        <span id="tasbeh-count" class="text-7xl font-black text-white">0</span>
                        <p id="tasbeh-target" class="text-emerald-500 font-bold mt-2 uppercase tracking-widest text-xs">Ҳадаф: 33</p>
                    </div>
                </div>
                <div class="flex gap-6 mt-12 items-center">
                    <button onclick="resetTasbeh()" class="w-14 h-14 rounded-full glass text-slate-400 btn-press"><i class="fas fa-undo"></i></button>
                    <button onclick="countTasbeh()" class="w-28 h-28 rounded-full bg-emerald-600 text-white text-4xl btn-press shadow-xl shadow-emerald-900/40"><i class="fas fa-hand-pointer"></i></button>
                    <button onclick="toggleTasbehGoal()" class="w-14 h-14 rounded-full glass text-emerald-500 font-bold btn-press">33/99</button>
                </div>
            </div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass py-5 flex justify-around rounded-t-[3rem] z-50">
        <button onclick="showTab('times')" id="btn-times" class="nav-btn active-tab flex flex-col items-center flex-1">
            <i class="fas fa-clock text-xl"></i><span class="text-[8px] mt-1 font-black uppercase">Вақт</span>
        </button>
        <button onclick="showTab('learn')" id="btn-learn" class="nav-btn text-slate-600 flex flex-col items-center flex-1">
            <i class="fas fa-book-open text-xl"></i><span class="text-[8px] mt-1 font-black uppercase">Омӯзиш</span>
        </button>
        <button onclick="showTab('dua')" id="btn-dua" class="nav-btn text-slate-600 flex flex-col items-center flex-1">
            <i class="fas fa-hands-holding-child text-xl"></i><span class="text-[8px] mt-1 font-black uppercase">Дуоҳо</span>
        </button>
        <button onclick="showTab('extra')" id="btn-extra" class="nav-btn text-slate-600 flex flex-col items-center flex-1">
            <i class="fas fa-dharmachakra text-xl"></i><span class="text-[8px] mt-1 font-black uppercase">Тасбеҳ</span>
        </button>
    </nav>

    <script>
        const PRAYER_NAMES = { Fajr: 'Бамдод', Dhuhr: 'Пешин', Asr: 'Аср', Maghrib: 'Шом', Isha: 'Хуфтан' };
        let currentTimings = {};
        let tasbehCount = 0;
        let tasbehGoal = 33;

        const HADITHS = [
            {t: "Беҳтарини шумо касест, ки Қуръонро омӯзад ва ба дигарон омӯзонад.", s: "Бухорӣ"},
            {t: "Дуо силоҳи мӯъмин аст.", s: "Муслим"},
            {t: "Намоз сутуни дин аст.", s: "Тирмизӣ"},
            {t: "Покӣ нишони имон аст.", s: "Аҳмад"}
        ];

        const LONG_DUOS = [
            {title: "Оятул Курсӣ", arabic: "اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...", trans: "Аллоҳу ло илоҳа илло ҳувал ҳайюл қайюм...", mean: "Аллоҳ, нест маъбуде барҳақ ҷуз Ӯ, ки ҳамеша зиндаву поянда аст..."},
            {title: "Дуои Қунут (барои Витр)", arabic: "اللَّهُمَّ إِنَّا نَسْتَعِينُكَ وَنَسْتَغْفِرُكَ...", trans: "Аллоҳумма инно настаъинука ва настағфирука...", mean: "Бор Илоҳо! Мо аз Ту ёрӣ мехоҳем ва аз Ту омурзиш металабем..."},
            {title: "Салавот бар Пайғамбар (с)", arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ...", trans: "Аллоҳумма салли ъало Муҳаммад...", mean: "Парвардигоро! Бар Муҳаммад (с) ва оли Муҳаммад (с) раҳмат фирист..."}
        ];

        const LEARN_STEPS = {
            fajr: {name: "Бамдод", r: "2 Суннат + 2 Фарз", info: "Аввал 2 ракъат суннат ва баъд 2 ракъат фарз хонда мешавад."},
            dhuhr: {name: "Пешин", r: "4 Суннат + 4 Фарз + 2 Суннат", info: "Дар Тоҷикистон соати 13:00 хонда мешавад."},
            asr: {name: "Аср", r: "4 Фарз", info: "Танҳо 4 ракъат фарз аст."},
            maghrib: {name: "Шом", r: "3 Фарз + 2 Суннат", info: "Дарҳол пас аз ғуруб."},
            isha: {name: "Хуфтан", r: "4 Фарз + 2 Суннат + 3 Витр", info: "Намози охирини шабонарӯз."}
        };

        function init() {
            const loc = localStorage.getItem('azon_loc');
            if(!loc) openCityModal();
            else {
                const l = JSON.parse(loc);
                fetchTimes(l.lat, l.lon, l.name);
            }
            renderHadith();
            renderLearn();
            renderDuos();
            setInterval(updateTimer, 1000);
        }

        async function fetchTimes(lat, lon, name) {
            document.querySelector('.city-display').innerText = name;
            const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=3`);
            const json = await res.json();
            currentTimings = json.data.timings;
            renderPrayers();
        }

        function renderPrayers() {
            const container = document.getElementById('prayer-list');
            container.innerHTML = "";
            Object.entries(PRAYER_NAMES).forEach(([id, name]) => {
                let time = currentTimings[id];
                if(id === 'Dhuhr') time = "13:00";
                const isNotify = localStorage.getItem('notify_'+id) !== 'false';
                
                container.innerHTML += `
                    <div class="glass p-5 rounded-[2.2rem] flex justify-between items-center transition-all active:scale-95" onclick="openLearn('${id.toLowerCase()}')">
                        <div class="flex items-center gap-4">
                            <button onclick="event.stopPropagation(); toggleNotify('${id}')" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center ${isNotify ? 'text-emerald-500' : 'text-slate-600'}">
                                <i class="fas ${isNotify ? 'fa-bell' : 'fa-bell-slash'}"></i>
                            </button>
                            <span class="font-bold text-slate-300 text-lg">${name}</span>
                        </div>
                        <span class="text-2xl font-black text-white tracking-tighter">${time}</span>
                    </div>
                `;
            });
        }

        function updateTimer() {
            if(!currentTimings.Fajr) return;
            const now = new Date();
            const times = Object.entries(PRAYER_NAMES).map(([id, name]) => {
                const [h, m] = currentTimings[id].split(':');
                const d = new Date();
                d.setHours(id === 'Dhuhr' ? 13 : h, id === 'Dhuhr' ? 0 : m, 0);
                return d;
            });

            let next = times.find(t => t > now) || times[0];
            let diff = next - now;
            if(diff < 0) diff += 86400000;

            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('next-prayer-timer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        // Tasbeh Logic
        function countTasbeh() {
            tasbehCount++;
            if(tasbehCount > tasbehGoal) tasbehCount = 1;
            document.getElementById('tasbeh-count').innerText = tasbehCount;
            const offset = 816 - (tasbehCount / tasbehGoal * 816);
            document.getElementById('tasbeh-progress').style.strokeDashoffset = offset;
            if(navigator.vibrate) navigator.vibrate(40);
        }

        function toggleTasbehGoal() {
            tasbehGoal = tasbehGoal === 33 ? 99 : 33;
            document.getElementById('tasbeh-target').innerText = `Ҳадаф: ${tasbehGoal}`;
            resetTasbeh();
        }

        function resetTasbeh() {
            tasbehCount = 0;
            document.getElementById('tasbeh-count').innerText = 0;
            document.getElementById('tasbeh-progress').style.strokeDashoffset = 816;
        }

        // Modals & Navigation
        function openCityModal() { document.getElementById('city-modal').classList.add('active'); }
        function setCity(lat, lon, name) {
            localStorage.setItem('azon_loc', JSON.stringify({lat, lon, name}));
            closeModal('city-modal');
            fetchTimes(lat, lon, name);
        }
        function toggleNotify(id) {
            const status = localStorage.getItem('notify_'+id) !== 'false';
            localStorage.setItem('notify_'+id, !status);
            renderPrayers();
        }
        function openDua(i) {
            const d = LONG_DUOS[i];
            document.getElementById('modal-content').innerHTML = `
                <h3 class="text-xl font-black text-emerald-500 mb-4">${d.title}</h3>
                <div class="bg-emerald-500/10 p-5 rounded-3xl mb-4 font-serif text-xl leading-loose text-center text-emerald-100">${d.arabic}</div>
                <div class="space-y-4 text-sm leading-relaxed">
                    <p class="text-slate-300 italic"><b class="text-emerald-500">Транскрипт:</b> ${d.trans}</p>
                    <p class="text-slate-400"><b class="text-emerald-500">Маъно:</b> ${d.mean}</p>
                </div>
            `;
            document.getElementById('info-modal').classList.add('active');
        }
        function openLearn(id) {
            const l = LEARN_STEPS[id];
            document.getElementById('modal-content').innerHTML = `
                <h3 class="text-2xl font-black text-emerald-500 mb-2">${l.name}</h3>
                <p class="text-xs uppercase font-bold text-slate-500 mb-4">${l.r}</p>
                <div class="space-y-4 text-slate-300 text-sm">
                    <div class="bg-white/5 p-4 rounded-2xl">${l.info}</div>
                    <p class="font-bold text-emerald-500">Тарзи адо кардан:</p>
                    <p class="leading-relaxed">Ният, Такбири таҳрима, Сано, Фотиҳа ва замми сура, Рукӯъ, Саҷда ва ғайра...</p>
                </div>
            `;
            document.getElementById('info-modal').classList.add('active');
        }
        function renderDuos() {
            const container = document.getElementById('dua-list');
            LONG_DUOS.forEach((d, i) => {
                container.innerHTML += `<div onclick="openDua(${i})" class="glass p-5 rounded-[2rem] flex justify-between items-center"><span class="font-bold text-sm">${d.title}</span><i class="fas fa-chevron-right text-slate-600"></i></div>`;
            });
        }
        function renderLearn() {
            const container = document.getElementById('learn-list');
            Object.entries(LEARN_STEPS).forEach(([id, l]) => {
                container.innerHTML += `<div onclick="openLearn('${id}')" class="glass p-5 rounded-[2rem] flex justify-between items-center"><div><p class="font-bold text-emerald-500">${l.name}</p><p class="text-[10px] text-slate-500 uppercase">${l.r}</p></div><i class="fas fa-arrow-right text-slate-600"></i></div>`;
            });
        }
        function renderHadith() {
            const h = HADITHS[new Date().getDate() % HADITHS.length];
            document.getElementById('daily-hadith').innerText = h.t;
            document.getElementById('hadith-source').innerText = h.s;
        }
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('tab-'+id).classList.add('active');
            document.getElementById('btn-'+id).classList.add('active-tab');
        }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function updateLocationGPS() { navigator.geolocation.getCurrentPosition(p => setCity(p.coords.latitude, p.coords.longitude, "Макони ҷорӣ")); }

        init();
    </script>
</body>
</html>
