<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Isfara FM - 93.9FM РАДИОИ ИСФАРА</title>
    
    <!-- Отключаем кэш -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== СБРОС ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7a1cff;
            --secondary: #9d4dff;
            --accent: #FF6B35;
            --text: #FFFFFF;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: linear-gradient(145deg, #2a0b5e 0%, #4a1b9e 40%, #7a1cff 70%, #9d4dff 100%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            font-size: 15px;
        }

        /* Плавный фон */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.3;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255,107,53,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(122,28,255,0.15) 0%, transparent 50%);
            animation: smoothFloat 25s ease infinite alternate;
        }

        @keyframes smoothFloat {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.05); opacity: 0.4; }
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            cursor: pointer;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255,107,53,0.2));
        }

        .logo-text h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .logo-text p {
            font-size: 12px;
            color: #FFD700;
            font-weight: 500;
        }

        .menu-btn {
            background: var(--glass);
            border: none;
            border-radius: 12px;
            color: white;
            width: 44px;
            height: 44px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-btn:hover {
            background: rgba(255,107,53,0.2);
        }

        /* Меню на весь экран */
        .side-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background: rgba(42, 11, 94, 0.98);
            backdrop-filter: blur(20px);
            transition: right 0.3s ease;
            z-index: 1000;
            padding: 80px 20px 30px;
            overflow-y: auto;
        }

        .side-menu.active {
            right: 0;
        }

        .menu-header {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 12px;
            margin-bottom: 25px;
            text-align: center;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
        }

        .menu-item:hover {
            background: rgba(255, 107, 53, 0.1);
        }

        .menu-item i {
            color: var(--accent);
            font-size: 20px;
            width: 24px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* Основной контент */
        .main-content {
            flex: 1;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 20px 30px;
            width: 100%;
        }

        /* Плеер с анимацией */
        .player-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .vinyl-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: rotate 15s linear infinite;
            animation-play-state: paused;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .wave-animation {
            position: absolute;
            bottom: -20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .wave-animation.active {
            opacity: 1;
        }

        .wave-bar {
            width: 5px;
            background: var(--accent);
            border-radius: 3px;
            animation: wave 1.2s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { height: 25px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 30px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 35px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 40px; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 35px; animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { height: 30px; animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { height: 25px; animation-delay: 0.6s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.4); }
        }

        /* Кнопка плеера большая с анимацией */
        .player-btn {
            background: var(--accent);
            border: none;
            border-radius: 50px;
            padding: 18px 40px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(255,107,53,0.3);
            margin: 15px 0 10px;
            min-width: 260px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 4px 20px rgba(255,107,53,0.3); }
            50% { transform: scale(1.02); box-shadow: 0 8px 30px rgba(255,107,53,0.5); }
            100% { transform: scale(1); box-shadow: 0 4px 20px rgba(255,107,53,0.3); }
        }

        .player-btn:hover {
            background: #ff5a24;
            animation: none;
            transform: scale(1.02);
        }

        .status-text {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
        }

        /* Инфо-блоки */
        .info-block {
            background: var(--glass);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .info-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .weather-temp {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .weather-details {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .currency-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 15px;
        }

        .currency-item:last-child {
            border-bottom: none;
        }

        .currency-code {
            font-weight: 600;
            color: var(--accent);
        }

        .currency-note {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-top: 10px;
            text-align: right;
        }

        /* Новости */
        .news-block {
            background: var(--glass);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
        }

        .news-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .news-item {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .news-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .news-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .news-excerpt {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .news-full-link {
            font-size: 12px;
            color: var(--accent);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
            cursor: pointer;
            display: inline-block;
        }

        .news-full-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .all-news-btn {
            display: block;
            width: fit-content;
            margin: 20px auto 5px;
            padding: 12px 30px;
            background: transparent;
            border: 1.5px solid var(--accent);
            border-radius: 40px;
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .all-news-btn:hover {
            background: var(--accent);
            color: white;
        }

        /* Реклама */
        .ad-section {
            margin: 20px 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .ad-top-text {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            font-size: 14px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .ad-carousel {
            position: relative;
            width: 100%;
            height: 160px;
        }

        .ad-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
            background-size: cover;
            background-position: center;
        }

        .ad-slide.active {
            opacity: 1;
            z-index: 2;
        }

        .ad-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px 15px 15px;
        }

        .ad-content h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .ad-link {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .ad-link:hover {
            background: #ff5a24;
        }

        .ad-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px 0;
            background: rgba(0,0,0,0.2);
        }

        .ad-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.2s;
        }

        .ad-dot.active {
            background: var(--accent);
            transform: scale(1.2);
        }

        /* Соцсети */
        .social-section {
            margin: 20px 0;
            text-align: center;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            transition: all 0.2s;
            text-decoration: none;
        }

        .social-icon:hover {
            transform: translateY(-3px);
        }

        .telegram { background: #0088cc; }
        .instagram { background: linear-gradient(45deg, #405DE6, #833AB4, #E1306C); }
        .youtube { background: #FF0000; }
        .whatsapp { background: #25D366; }

        /* Контент-секции */
        .content-section {
            display: none;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
        }

        .content-section.active {
            display: block;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
        }

        /* Команда */
        .team-grid, .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .team-card, .partner-card {
            background: var(--glass);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }

        .team-card img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .team-card h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .team-card p {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }

        .partner-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: brightness(0) invert(1);
        }

        .partner-card h3 {
            font-size: 14px;
        }

        /* Расписание */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        @media (min-width: 600px) {
            .days-grid {
                grid-template-columns: repeat(7, 1fr);
            }
        }

        .day-btn {
            padding: 8px 4px;
            background: var(--glass);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .day-btn.active {
            background: var(--accent);
        }

        .program-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: var(--glass);
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .program-time {
            color: var(--accent);
            font-weight: 500;
        }

        /* Настройки */
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .settings-item:last-child {
            border-bottom: none;
        }

        .settings-label {
            font-size: 15px;
            font-weight: 500;
        }

        .settings-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
        }

        /* Уведомление (toast) */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 14px 24px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 3000;
            border: 1px solid var(--accent);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;
            white-space: nowrap;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* Футер */
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            font-size: 13px;
            margin-top: auto;
        }

        .footer-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>

    <!-- Шапка -->
    <header id="logoHome">
        <div class="logo-container">
            <img src="https://i.ibb.co/39MLN2z8/photo-2026-01-28-08-19-22-no-bg-preview-carve-photos.png" class="logo">
            <div class="logo-text">
                <h1>Isfara FM</h1>
                <p>93.9FM</p>
            </div>
        </div>
        <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
    </header>

    <!-- Меню с иконками -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">Isfara FM</div>
        <div class="menu-item" data-section="main" data-tg="Асосӣ" data-ru="Главная"><i class="fas fa-home"></i><span></span></div>
        <div class="menu-item" data-section="schedule" data-tg="Ҷадвал" data-ru="Расписание"><i class="fas fa-calendar-alt"></i><span></span></div>
        <div class="menu-item" data-section="about" data-tg="Дар бораи мо" data-ru="О радио"><i class="fas fa-info-circle"></i><span></span></div>
        <div class="menu-item" data-section="team" data-tg="Дастаи мо" data-ru="Команда"><i class="fas fa-users"></i><span></span></div>
        <div class="menu-item" data-section="partners" data-tg="Шарикон" data-ru="Партнёры"><i class="fas fa-handshake"></i><span></span></div>
        <div class="menu-item" data-section="support" data-tg="Дастгирӣ" data-ru="Поддержка"><i class="fas fa-headset"></i><span></span></div>
        <div class="menu-item" data-section="settings" data-tg="Танзимот" data-ru="Настройки"><i class="fas fa-cog"></i><span></span></div>
    </div>
    
    <div class="overlay" id="overlay"></div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div class="main-content" id="mainContent">
        <!-- Плеер -->
        <div class="player-section">
            <div class="vinyl-container">
                <img src="https://i.ibb.co/39MLN2z8/photo-2026-01-28-08-19-22-no-bg-preview-carve-photos.png" class="vinyl" id="vinyl">
                <div class="wave-animation" id="waveAnimation">
                    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                </div>
            </div>
            <button class="player-btn" id="playBtn"><i class="fas fa-play"></i> <span>Гӯш кардан</span></button>
            <div class="status-text" id="status">Барои гӯш кардан тугмаро пахш кунед</div>
        </div>

        <!-- Погода -->
        <div class="info-block">
            <div class="info-title"><i class="fas fa-cloud-sun"></i> <span data-tg="Обу ҳаво дар Исфара" data-ru="Погода в Исфаре"></span></div>
            <div class="weather-temp" id="weatherTemp">--°C</div>
            <div class="weather-details" id="weatherDetails">Намӣ: --% | Шамол: -- м/с</div>
        </div>

        <!-- Курс валют -->
        <div class="info-block">
            <div class="info-title"><i class="fas fa-coins"></i> <span data-tg="Курби асъор" data-ru="Курс валют"></span></div>
            <div class="currency-item"><span class="currency-code">1 USD</span> <span id="usdRate">10.95</span> <span data-tg="сомонӣ" data-ru="сомони"></span></div>
            <div class="currency-item"><span class="currency-code">1 EUR</span> <span id="eurRate">11.82</span> <span data-tg="сомонӣ" data-ru="сомони"></span></div>
            <div class="currency-item"><span class="currency-code">1 RUB</span> <span id="rubRate">0.12</span> <span data-tg="сомонӣ" data-ru="сомони"></span></div>
            <div class="currency-note" data-tg="*Курб тибқи Бонки Миллӣ, дар бонкҳо фарқ карда метавонад" data-ru="*Курс по данным Нацбанка, в банках может отличаться"></div>
        </div>

        <!-- Новости -->
        <div class="news-block">
            <div class="news-header"><i class="fas fa-newspaper"></i> <span data-tg="Хабарҳои Исфара" data-ru="Новости Исфары"></span></div>
            
            <div class="news-item">

                    if(d.main){
                        document.getElementById('weatherTemp').innerText = Math.round(d.main.temp)+'°C';
                        document.getElementById('weatherDetails').innerHTML = (currentLang=='tg'?`Намӣ: ${d.main.humidity}% | Шамол: ${d.wind.speed} м/с`:`Влажность: ${d.main.humidity}% | Ветер: ${d.wind.speed} м/с`);

                }).catch(() => {
                    document.getElementById('weatherTemp').innerText = '+18°C';
                    document.getElementById('weatherDetails').innerHTML = currentLang=='tg'?'Намӣ: 65% | Шамол: 3 м/с':'Влажность: 65% | Ветер: 3 м/с';

        }

                    document.getElementById('usdRate').innerText = tjs.toFixed(2);
                    document.getElementById('eurRate').innerText = (tjs*1.08).toFixed(2);
                    document.getElementById('rubRate').innerText = (tjs*0.012).toFixed(2);
                }).catch(() => {
                    document.getElementById('usdRate').innerText = '10.95';
                    document.getElementById('eurRate').innerText = '11.82';
                    document.getElementById('rubRate').innerText = '0.12';

            });
            document.getElementById('overlay').addEventListener('click', ()=>{
                document.getElementById('sideMenu').classList.remove('active');
                document.getElementById('overlay').classList.remove('active');
            });
        }

        function showSection(section){
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById('mainContent').style.display = 'none';
            if(section === 'main') document.getElementById('mainContent').style.display = 'block';
            else {
                const map = {schedule:'scheduleSection', about:'aboutSection', team:'teamSection', partners:'partnersSection', support:'supportSection', settings:'settingsSection'};
                if(map[section]) document.getElementById(map[section]).classList.add('active');
            }
            document.getElementById('sideMenu').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        function setupPlayer(){
            const audio = document.getElementById('radioStream');
            const btn = document.getElementById('playBtn');
            const status = document.getElementById('status');
            const vinyl = document.getElementById('vinyl');
            const wave = document.getElementById('waveAnimation');
            btn.addEventListener('click', ()=>{
                if(!isPlaying){
                    audio.play().then(()=>{
                        isPlaying = true;
                        btn.innerHTML = '<i class="fas fa-pause"></i> <span>' + (currentLang=='tg'?'Таваққуф':'Пауза') + '</span>';
                        wave.classList.add('active');
                        vinyl.classList.add('playing');
                        status.textContent = currentLang=='tg'?'Гӯш карда истодаед...':'Слушаем...';
                    }).catch(()=> status.textContent = currentLang=='tg'?'Хатогӣ':'Ошибка');
                } else {
                    audio.pause();
                    isPlaying = false;
                    btn.innerHTML = '<i class="fas fa-play"></i> <span>' + (currentLang=='tg'?'Гӯш кардан':'Слушать') + '</span>';
                    wave.classList.remove('active');
                    vinyl.classList.remove('playing');
                    status.textContent = currentLang=='tg'?'Барои гӯш кардан тугмаро пахш кунед':'Нажмите кнопку';
                }
            });
            audio.addEventListener('waiting', ()=> status.textContent = currentLang=='tg'?'Интизор шавед...':'Буферизация...');
            audio.addEventListener('error', ()=>{
                status.textContent = currentLang=='tg'?'Хатогӣ':'Ошибка';
                isPlaying = false;
                btn.innerHTML = '<i class="fas fa-play"></i> <span>' + (currentLang=='tg'?'Гӯш кардан':'Слушать') + '</span>';
                wave.classList.remove('active');
                vinyl.classList.remove('playing');
            });
        }

        function showSchedule(day){
            const list = document.getElementById('programList');
            list.innerHTML = '';
            if(schedules[day]){
                schedules[day].forEach(item => {
                    let div = document.createElement('div');
                    div.className = 'program-item';
                    div.innerHTML = `<span class="program-time">${item.time}</span><span>${item.title}</span>`;
                    list.appendChild(div);
                });
            }
        }

        function setupSchedule(){
            showSchedule('monday');
        }

        function setupAdCarousel(){
            let current = 0;
            const slides = document.querySelectorAll('.ad-slide');
            const dots = document.querySelectorAll('.ad-dot');
            if(!slides.length) return;
            setInterval(()=>{
                slides[current].classList.remove('active');
                dots[current].classList.remove('active');
                current = (current + 1) % slides.length;
                slides[current].classList.add('active');
                dots[current].classList.add('active');
            }, 5000);
        }
    </script>
</body>
</html>
