<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azon | Намози Комил</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981; /* Emerald 500 */
            --primary-dark: #059669;
            --bg-dark: #020617;
            --card-bg: rgba(15, 23, 42, 0.7);
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #064e3b 0%, #020617 40%);
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.1);
            border-radius: 28px;
        }
        
        .active-tab {
            color: var(--primary) !important;
        }

        .active-tab i {
            transform: translateY(-2px);
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.5));
        }
        
        .tab-content {
            display: none;
            animation: slideUp 0.4s ease-out;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }
        
        .modal.active { display: block; }
        
        .arabic-text {
            font-family: 'Amiri', serif;
            line-height: 2.5;
            text-align: center;
            font-size: 1.8rem;
            color: #ecfdf5;
        }

        .prayer-row {
            transition: all 0.2s;
            border-left: 0px solid var(--primary);
        }
        .prayer-row:active { transform: scale(0.98); background: rgba(16, 185, 129, 0.05); }

        /* Убираем полоску сверху в навигации */
        nav { border-top: none !important; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="antialiased pb-32">

    <div id="modal" class="modal">
        <div class="max-w-xl mx-auto px-6 py-10">
            <div class="flex justify-between items-center mb-8 sticky top-0 bg-black/50 py-2 rounded-full px-4 backdrop-blur-md">
                <h2 id="modal-title" class="text-xl font-black text-emerald-400"></h2>
                <button onclick="closeModal()" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-xl">&times;</button>
            </div>
            <div id="modal-content" class="space-y-6"></div>
        </div>
    </div>

    <div id="city-modal" class="modal">
        <div class="max-w-md mx-auto p-6 mt-10">
            <div class="glass-card p-6">
                <h2 class="text-2xl font-black text-emerald-500 mb-6 text-center">Маконро интихоб кунед</h2>
                <button onclick="getUserLocation()" class="w-full bg-emerald-600 py-4 rounded-2xl font-bold flex items-center justify-center gap-3 mb-6 shadow-lg shadow-emerald-900/40">
                    <i class="fas fa-location-arrow"></i> Муайянкунии GPS
                </button>
                <div class="grid grid-cols-2 gap-3" id="city-list">
                    </div>
            </div>
        </div>
    </div>

    <header class="p-6">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-4xl font-black tracking-tighter text-emerald-500 italic">AZON</h1>
                <div onclick="openCityModal()" class="flex items-center gap-2 mt-1 text-slate-400 font-bold text-xs uppercase tracking-widest">
                    <i class="fas fa-location-dot text-emerald-500"></i>
                    <span id="city-name">Душанбе</span>
                </div>
            </div>
            <div class="text-right">
                <p id="next-prayer-label" class="text-[10px] font-bold text-slate-500 uppercase">То намози оянда:</p>
                <p id="countdown-timer" class="text-2xl font-black text-emerald-400 font-mono">00:00:00</p>
            </div>
        </div>
    </header>

    <main class="px-4">
        <section id="tab-times" class="tab-content active">
            <div class="glass-card p-6 mb-6 bg-gradient-to-br from-emerald-900/20 to-transparent">
                <div class="flex items-center gap-2 mb-3">
                    <i class="fas fa-quote-left text-emerald-500 text-xs"></i>
                    <span class="text-[10px] font-bold text-emerald-500 uppercase tracking-widest">Ҳадиси рӯз</span>
                </div>
                <p id="hadith-text" class="text-sm font-medium leading-relaxed italic">Беҳтарини шумо касест, ки Қуръонро омӯзад ва ба дигарон омӯзонад.</p>
            </div>

            <div id="prayer-list" class="space-y-3">
                </div>
        </section>

        <section id="tab-learn" class="tab-content">
            <h2 class="text-2xl font-black mb-6 px-2">Омӯзиши Намоз</h2>
            <div id="learn-list" class="space-y-3"></div>
        </section>

        <section id="tab-dua" class="tab-content">
            <h2 class="text-2xl font-black mb-6 px-2">Хазинаи Дуоҳо</h2>
            <div id="dua-list" class="grid grid-cols-1 gap-3"></div>
        </section>

        <section id="tab-extra" class="tab-content">
            <div class="flex flex-col items-center pt-10">
                <div class="w-72 h-72 rounded-full border-[12px] border-emerald-500/10 flex flex-col items-center justify-center relative shadow-[0_0_50px_rgba(16,185,129,0.1)]">
                    <span id="tasbih-count" class="text-8xl font-black text-white">0</span>
                    <span id="tasbih-target" class="text-xs font-bold text-emerald-500 uppercase tracking-widest mt-2">Ҳадаф: 33</span>
                </div>
                <div class="flex gap-6 mt-16">
                    <button onclick="resetTasbih()" class="w-16 h-16 rounded-full glass-card text-slate-400"><i class="fas fa-sync"></i></button>
                    <button onclick="countTasbih()" class="w-28 h-28 rounded-full bg-emerald-600 text-white text-4xl shadow-xl shadow-emerald-900/40 active:scale-90 transition-transform"><i class="fas fa-fingerprint"></i></button>
                    <button onclick="toggleGoal()" class="w-16 h-16 rounded-full glass-card text-emerald-500 font-bold text-sm">33/99</button>
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass-card mx-4 mb-6 py-5 flex justify-around rounded-[2.5rem] z-50">
        <button onclick="showTab('times')" id="btn-times" class="nav-btn active-tab flex flex-col items-center flex-1">
            <i class="fas fa-clock text-xl"></i><span class="text-[9px] mt-1 font-bold uppercase">Вақт</span>
        </button>
        <button onclick="showTab('learn')" id="btn-learn" class="nav-btn text-slate-500 flex flex-col items-center flex-1">
            <i class="fas fa-book-open text-xl"></i><span class="text-[9px] mt-1 font-bold uppercase">Омӯзиш</span>
        </button>
        <button onclick="showTab('dua')" id="btn-dua" class="nav-btn text-slate-500 flex flex-col items-center flex-1">
            <i class="fas fa-kaaba text-xl"></i><span class="text-[9px] mt-1 font-bold uppercase">Дуоҳо</span>
        </button>
        <button onclick="showTab('extra')" id="btn-extra" class="nav-btn text-slate-500 flex flex-col items-center flex-1">
            <i class="fas fa-beads text-xl"></i><span class="text-[9px] mt-1 font-bold uppercase">Тасбеҳ</span>
        </button>
    </nav>

    <script>
        const PRAYERS = { Fajr: 'Бамдод', Dhuhr: 'Пешин', Asr: 'Аср', Maghrib: 'Шом', Isha: 'Хуфтан' };
        const CITIES = ['Душанбе', 'Хуҷанд', 'Бохтар', 'Кӯлоб', 'Исфара', 'Истаравшан', 'Ваҳдат', 'Ҳисор'];
        let currentTimings = {};
        let tCount = 0, tGoal = 33;

        // Инициализация
        function init() {
            renderCityList();
            const saved = localStorage.getItem('azon_loc');
            if(saved) {
                const l = JSON.parse(saved);
                fetchTimes(l.lat, l.lon, l.name);
            } else {
                openCityModal();
            }
            renderLearn();
            renderDuas();
            setInterval(updateClock, 1000);
        }

        async function fetchTimes(lat, lon, name) {
            document.getElementById('city-name').innerText = name;
            const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=3`);
            const data = await res.json();
            currentTimings = data.data.timings;
            renderPrayers();
        }

        function renderPrayers() {
            const container = document.getElementById('prayer-list');
            container.innerHTML = "";
            Object.entries(PRAYERS).forEach(([id, name]) => {
                let time = id === 'Dhuhr' ? '13:00' : currentTimings[id];
                const isNotify = localStorage.getItem('notify_'+id) !== 'false';
                container.innerHTML += `
                    <div class="glass-card p-5 flex justify-between items-center prayer-row" onclick="openLearnInfo('${id}')">
                        <div class="flex items-center gap-4">
                            <div onclick="event.stopPropagation(); toggleNotify('${id}')" class="w-10 h-10 rounded-2xl flex items-center justify-center ${isNotify ? 'bg-emerald-500/10 text-emerald-500' : 'bg-slate-800 text-slate-600'}">
                                <i class="fas ${isNotify ? 'fa-bell' : 'fa-bell-slash'}"></i>
                            </div>
                            <span class="font-bold text-lg">${name}</span>
                        </div>
                        <span class="text-2xl font-black text-white">${time}</span>
                    </div>
                `;
            });
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('countdown-timer').innerText = now.toLocaleTimeString('ru-RU');
        }

        function renderCityList() {
            const list = document.getElementById('city-list');
            CITIES.forEach(c => {
                list.innerHTML += `<button onclick="setCityByName('${c}')" class="p-3 bg-white/5 rounded-xl text-sm font-bold hover:bg-emerald-500/20">${c}</button>`;
            });
        }

        function setCityByName(name) {
            const coords = { 'Душанбе': [38.53, 68.78], 'Хуҷанд': [40.28, 69.62] }; // Добавь остальные
            const c = coords[name] || [38.53, 68.78];
            localStorage.setItem('azon_loc', JSON.stringify({lat: c[0], lon: c[1], name: name}));
            fetchTimes(c[0], c[1], name);
            closeCityModal();
        }

        // Тасбех
        function countTasbih() {
            tCount++; if(tCount > tGoal) tCount = 1;
            document.getElementById('tasbeh-count').innerText = tCount;
            if(navigator.vibrate) navigator.vibrate(50);
        }
        function resetTasbih() { tCount = 0; document.getElementById('tasbeh-count').innerText = 0; }
        function toggleGoal() { tGoal = tGoal === 33 ? 99 : 33; document.getElementById('tasbeh-target').innerText = "Ҳадаф: " + tGoal; resetTasbih(); }

        // Навигация
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('tab-'+id).classList.add('active');
            document.getElementById('btn-'+id).classList.add('active-tab');
        }

        function openCityModal() { document.getElementById('city-modal').classList.add('active'); }
        function closeCityModal() { document.getElementById('city-modal').classList.remove('active'); }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        // Наполнение обучения и дуо (сокращено для примера)
        function renderLearn() {
            const list = document.getElementById('learn-list');
            Object.values(PRAYERS).forEach(p => {
                list.innerHTML += `<div class="glass-card p-5 flex justify-between items-center" onclick="openLearnInfo('${p}')">
                    <span class="font-bold">${p}</span><i class="fas fa-chevron-right text-slate-600"></i>
                </div>`;
            });
        }

        function renderDuas() {
            const list = document.getElementById('dua-list');
            const duos = [{t:'Оятул Курсӣ', i:'fa-shield-halved'}, {t:'Дуои Қунут', i:'fa-hands-praying'}];
            duos.forEach(d => {
                list.innerHTML += `<div class="glass-card p-5 flex items-center gap-4" onclick="openDua('${d.t}')">
                    <div class="w-12 h-12 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-500"><i class="fas ${d.i}"></i></div>
                    <span class="font-bold">${d.t}</span>
                </div>`;
            });
        }

        function openDua(title) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerHTML = `<div class="arabic-text">اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...</div><p class="text-slate-400 text-center mt-4 italic">Тарҷума: Аллоҳ нест маъбуде ба ҷуз Ӯ...</p>`;
            document.getElementById('modal').classList.add('active');
        }

        init();
    </script>
</body>
</html>
