<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azon — Намоз ва Дуо</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f1f5f9; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .active-tab { color: #10b981 !important; transform: translateY(-2px); }
        .tab-content { display: none; animation: slideUp 0.3s ease-out; }
        .tab-content.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal.active { display: block; }
        .tasbeh-btn { transition: transform 0.1s; }
        .tasbeh-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="min-h-screen pb-32">

    <div id="info-modal" class="modal">
        <div class="glass w-full max-w-lg mx-auto p-6 rounded-[2.5rem] mt-10 mb-10">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modal-title" class="text-2xl font-black text-emerald-500">Маълумот</h2>
                <button onclick="closeModal()" class="text-slate-400 text-2xl">&times;</button>
            </div>
            <div id="modal-body" class="text-slate-200 leading-relaxed space-y-4">
                </div>
        </div>
    </div>

    <header class="p-6 flex justify-between items-center sticky top-0 bg-[#020617]/80 backdrop-blur-md z-40">
        <div>
            <h1 class="text-3xl font-black text-emerald-500 tracking-tighter">AZON</h1>
            <p class="text-[10px] uppercase tracking-widest text-slate-500 city-display" onclick="toggleCityModal()">Ҷустуҷӯи макон...</p>
        </div>
        <div class="glass px-3 py-1 rounded-full border-emerald-500/30 flex items-center">
            <span id="live-clock" class="text-sm font-bold text-emerald-400">00:00:00</span>
        </div>
    </header>

    <main class="px-4">
        
        <section id="tab-times" class="tab-content active">
            <div class="glass rounded-[2rem] p-5 mb-6 bg-gradient-to-br from-emerald-950/20 to-transparent">
                <div class="flex items-center gap-2 mb-2 text-emerald-500">
                    <i class="fas fa-quote-left text-xs"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest">Ҳадиси рӯз</span>
                </div>
                <p id="daily-hadith" class="text-sm italic font-medium">...</p>
                <p id="hadith-source" class="text-[10px] text-slate-500 mt-2 text-right italic"></p>
            </div>

            <div id="prayer-list" class="space-y-3">
                </div>
        </section>

        <section id="tab-learn" class="tab-content">
            <h2 class="text-2xl font-black mb-6 px-2">Омӯзиши Намоз</h2>
            <div class="grid gap-3" id="learn-list">
                </div>
        </section>

        <section id="tab-dua" class="tab-content">
            <h2 class="text-2xl font-black mb-6 px-2">Хазинаи Дуоҳо</h2>
            <div id="dua-list" class="space-y-4">
                </div>
        </section>

        <section id="tab-extra" class="tab-content">
            <h2 class="text-2xl font-black mb-6 px-2 text-center">Тасбеҳи рақамӣ</h2>
            <div class="flex flex-col items-center justify-center pt-10">
                <div class="w-64 h-64 rounded-full border-8 border-emerald-500/20 flex flex-col items-center justify-center relative">
                    <span id="tasbeh-count" class="text-6xl font-black text-emerald-500">0</span>
                    <span class="text-xs text-slate-500 uppercase mt-2 tracking-widest font-bold" id="tasbeh-circle">33 / 100</span>
                </div>
                <div class="flex gap-4 mt-12">
                    <button onclick="resetTasbeh()" class="w-16 h-16 rounded-full glass text-slate-400"><i class="fas fa-rotate-right"></i></button>
                    <button onclick="countTasbeh()" class="w-24 h-24 rounded-full bg-emerald-600 text-white text-3xl tasbeh-btn shadow-lg shadow-emerald-900/40"><i class="fas fa-fingerprint"></i></button>
                </div>
            </div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass py-5 flex justify-around rounded-t-[2.5rem] z-50 border-none">
        <button onclick="showTab('times')" id="btn-times" class="nav-btn active-tab flex flex-col items-center flex-1">
            <i class="fas fa-clock-rotate-left text-xl"></i>
            <span class="text-[8px] mt-1 font-black uppercase">Вақт</span>
        </button>
        <button onclick="showTab('learn')" id="btn-learn" class="nav-btn text-slate-500 flex flex-col items-center flex-1">
            <i class="fas fa-book-quran text-xl"></i>
            <span class="text-[8px] mt-1 font-black uppercase">Омӯзиш</span>
        </button>
        <button onclick="showTab('dua')" id="btn-dua" class="nav-btn text-slate-500 flex flex-col items-center flex-1">
            <i class="fas fa-hands-praying text-xl"></i>
            <span class="text-[8px] mt-1 font-black uppercase">Дуоҳо</span>
        </button>
        <button onclick="showTab('extra')" id="btn-extra" class="nav-btn text-slate-500 flex flex-col items-center flex-1">
            <i class="fas fa-bead-tree text-xl"></i>
            <span class="text-[8px] mt-1 font-black uppercase">Тасбеҳ</span>
        </button>
    </nav>

    <script>
        // --- ДАННЫЕ ПРИЛОЖЕНИЯ ---
        const HADITHS = [
            {t: "Беҳтарини шумо касест, ки Қуръонро омӯзад ва ба дигарон омӯзонад.", s: "Бухорӣ"},
            {t: "Дуо силоҳи мӯъмин, сутуни дин ва нури осмонҳову замин аст.", s: "Абу Яъло"},
            {t: "Намоз нури чашмони ман аст.", s: "Насоӣ"},
            {t: "Ҷаннат зери қадами модарон аст.", s: "Аҳмад"},
            {t: "Покӣ нишони имон аст.", s: "Муслим"}
        ];

        const LEARN_DATA = {
            fajr: { title: "Бамдод", rakat: "2 суннат, 2 фарз", desc: "Аввалин намози рӯз. Вақти он аз дамидани субҳи содиқ то баромадани офтоб аст." },
            dhuhr: { title: "Пешин", rakat: "4 суннат, 4 фарз, 2 суннат", desc: "Вақти ин намоз дар Тоҷикистон соати 13:00 муайян шудааст." },
            asr: { title: "Аср", rakat: "4 фарз", desc: "Вақти намози аср вақтест, ки сояи ҳар чиз ду баробари худаш шавад." },
            maghrib: { title: "Шом", rakat: "3 фарз, 2 суннат", desc: "Дарҳол пас аз ғуруби офтоб хонда мешавад." },
            isha: { title: "Хуфтан", rakat: "4 фарз, 2 суннат, 3 витр", desc: "Вақти он пас аз гум шудани шафақ (сурхӣ) дар уфуқ оғоз мешавад." }
        };

        const DUOS = [
            {t: "Дуои ворид шудан ба масҷид", a: "Аллоҳумма-фтаҳ лӣ абвоба раҳматик", m: "Худовандо, дарҳои раҳмататро бароям боз кун."},
            {t: "Дуои баъд аз таом", a: "Алҳамдулиллоҳиллазӣ атьамана ва сақоно...", m: "Шукр Худоеро, ки моро таъом дод ва сероб гардонид."},
            {t: "Дуои хоб рафтан", a: "Би-исмика Аллоҳумма амуту ва аҳё", m: "Бо номи Ту, Худовандо, мемираму зинда мешавам."}
        ];

        // --- ЛОГИКА ---
        let count = 0;

        function init() {
            updateClock();
            setInterval(updateClock, 1000);
            renderHadith();
            renderLearn();
            renderDuos();
            loadTimes();
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('ru-RU');
        }

        function renderHadith() {
            const day = new Date().getDate();
            const h = HADITHS[day % HADITHS.length];
            document.getElementById('daily-hadith').innerText = h.t;
            document.getElementById('hadith-source').innerText = `— ${h.s}`;
        }

        async function loadTimes() {
            const lat = 38.53, lon = 68.78; // По умолчанию Душанбе
            const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=3`);
            const d = await res.json();
            const t = d.data.timings;
            
            const list = document.getElementById('prayer-list');
            const map = {Fajr:'Бамдод', Sunrise:'Офтоб', Dhuhr:'Пешин', Asr:'Аср', Maghrib:'Шом', Isha:'Хуфтан'};
            
            list.innerHTML = "";
            Object.entries(map).forEach(([id, name]) => {
                let time = t[id];
                if(id === 'Dhuhr') time = "13:00"; // ФИКСАЦИЯ ПЕШИНА

                list.innerHTML += `
                    <div class="glass p-5 rounded-[2rem] flex justify-between items-center active:scale-95 transition-all" onclick="openLearn('${id.toLowerCase()}')">
                        <div class="flex items-center gap-4">
                            <div class="w-2 h-2 rounded-full ${id === 'Fajr' ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-slate-700'}"></div>
                            <span class="font-bold text-slate-300">${name}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-2xl font-black">${time}</span>
                            <i class="fas fa-bell text-xs text-slate-600"></i>
                        </div>
                    </div>
                `;
            });
            document.querySelector('.city-display').innerText = "Душанбе, Тоҷикистон";
        }

        function renderLearn() {
            const container = document.getElementById('learn-list');
            Object.entries(LEARN_DATA).forEach(([key, val]) => {
                container.innerHTML += `
                    <div class="glass p-5 rounded-2xl flex justify-between items-center" onclick="openLearn('${key}')">
                        <div>
                            <p class="font-black text-emerald-500">${val.title}</p>
                            <p class="text-[10px] text-slate-400 uppercase tracking-tighter">${val.rakat}</p>
                        </div>
                        <i class="fas fa-chevron-right text-slate-600"></i>
                    </div>
                `;
            });
        }

        function renderDuos() {
            const container = document.getElementById('dua-list');
            DUOS.forEach(d => {
                container.innerHTML += `
                    <div class="glass p-5 rounded-3xl" onclick="openDua('${d.t}', '${d.a}', '${d.m}')">
                        <p class="font-bold text-emerald-500 text-sm mb-1">${d.t}</p>
                        <p class="text-xs text-slate-400 line-clamp-1">${d.a}</p>
                    </div>
                `;
            });
        }

        function openLearn(key) {
            const data = LEARN_DATA[key] || {title: "Маълумот", rakat: "", desc: "Маълумот ба зудӣ илова мешавад..."};
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-body').innerHTML = `
                <div class="bg-emerald-500/10 p-4 rounded-2xl border border-emerald-500/20 text-center">
                    <p class="text-xs uppercase text-emerald-500 font-bold mb-1">Миқдори ракъатҳо</p>
                    <p class="text-xl font-black">${data.rakat}</p>
                </div>
                <p class="text-slate-300">${data.desc}</p>
                <div class="pt-4 border-t border-slate-800">
                    <p class="text-sm font-bold text-emerald-500 mb-2 italic text-center">Тарзи хондан:</p>
                    <p class="text-xs text-slate-400 leading-loose text-center">Ният -> Такбир -> Сано -> Сураи Фотиҳа -> Сураи иловагӣ -> Рукӯъ -> Саҷда...</p>
                </div>
            `;
            document.getElementById('info-modal').classList.add('active');
        }

        function openDua(title, arabic, mean) {
            document.getElementById('modal-title').innerText = "Дуо";
            document.getElementById('modal-body').innerHTML = `
                <h3 class="font-black text-center text-xl text-emerald-500">${title}</h3>
                <div class="glass p-6 rounded-3xl mt-4">
                    <p class="text-xl text-center font-serif leading-relaxed text-emerald-100">${arabic}</p>
                </div>
                <div class="p-4 italic text-slate-400 text-center text-sm border-l-2 border-emerald-500">
                    "${mean}"
                </div>
            `;
            document.getElementById('info-modal').classList.add('active');
        }

        function countTasbeh() {
            count++;
            document.getElementById('tasbeh-count').innerText = count;
            document.getElementById('tasbeh-circle').innerText = (count % 33) + " / 33";
            if(window.navigator.vibrate) window.navigator.vibrate(50);
        }

        function resetTasbeh() { count = 0; document.getElementById('tasbeh-count').innerText = 0; }

        function closeModal() { document.getElementById('info-modal').classList.remove('active'); }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab', 'text-emerald-500'));
            document.getElementById('tab-'+id).classList.add('active');
            document.getElementById('btn-'+id).classList.add('active-tab');
        }

        init();
    </script>
</body>
</html>
