<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azon — Вақти Намоз</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617; 
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent; 
        }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        .active-tab { color: #fbbf24; border-top: 3px solid #fbbf24; }
        .tab-content { display: none; animation: fadeIn 0.4s ease-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .next-prayer-glow { box-shadow: 0 0 30px rgba(251, 191, 36, 0.15); }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    <header class="p-6 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black tracking-tighter text-amber-500">AZON</h1>
            <div class="flex items-center text-slate-400 mt-1">
                <i class="fas fa-location-dot text-[10px] mr-1 text-emerald-500"></i>
                <p class="text-[10px] uppercase tracking-widest city-name">Ҷустуҷӯ...</p>
            </div>
        </div>
        <div class="glass h-12 w-12 rounded-2xl flex items-center justify-center border-amber-500/20">
            <i class="fas fa-moon text-amber-400"></i>
        </div>
    </header>

    <main class="px-4 pb-32">
        
        <section id="tab-times" class="tab-content active">
            <div class="glass rounded-[2rem] p-6 mb-8 relative overflow-hidden">
                <div class="absolute -top-4 -right-4 opacity-10 text-6xl text-amber-500">
                    <i class="fas fa-quote-right"></i>
                </div>
                <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-amber-500 mb-3">Ҳадиси рӯз</h3>
                <p id="daily-hadith" class="text-base leading-relaxed text-slate-100 font-medium">
                    "Беҳтарини шумо касест, ки Қуръонро омӯзад..."
                </p>
                <div id="hadith-source" class="text-[10px] text-slate-500 mt-4 flex items-center">
                    <span class="h-[1px] w-4 bg-slate-700 mr-2"></span> Саҳеҳи Бухорӣ
                </div>
            </div>

            <h2 class="text-sm font-bold text-slate-400 mb-4 px-2 uppercase tracking-widest">Вақтҳои Намоз</h2>
            <div id="prayer-list" class="space-y-3">
                </div>
        </section>

        <section id="tab-learn" class="tab-content">
            <h2 class="text-2xl font-extrabold mb-6">Омӯзиш</h2>
            <div class="grid gap-4">
                <div class="glass p-5 rounded-[2rem] border-l-4 border-emerald-500">
                    <h3 class="font-bold text-amber-400 mb-3">Ракаатҳои намоз</h3>
                    <div class="space-y-2 text-sm text-slate-300">
                        <div class="flex justify-between p-2 hover:bg-white/5 rounded-lg"><span>Бамдод</span> <span class="text-white font-bold">2+2</span></div>
                        <div class="flex justify-between p-2 hover:bg-white/5 rounded-lg"><span>Пешин</span> <span class="text-white font-bold">4+4+2</span></div>
                        <div class="flex justify-between p-2 hover:bg-white/5 rounded-lg"><span>Аср</span> <span class="text-white font-bold">4</span></div>
                        <div class="flex justify-between p-2 hover:bg-white/5 rounded-lg"><span>Шом</span> <span class="text-white font-bold">3+2</span></div>
                        <div class="flex justify-between p-2 hover:bg-white/5 rounded-lg"><span>Хуфтан</span> <span class="text-white font-bold">4+2+3</span></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-dua" class="tab-content">
            <h2 class="text-2xl font-extrabold mb-6">Дуоҳо</h2>
            <div id="dua-container" class="space-y-4">
                </div>
        </section>

    </main>

    <nav class="fixed bottom-6 left-4 right-4 glass border-t border-white/10 flex justify-around py-3 rounded-[2.5rem] z-50 shadow-2xl">
        <button onclick="showTab('times')" class="nav-btn active-tab flex flex-col items-center flex-1 transition-all" id="btn-times">
            <i class="fas fa-clock text-xl"></i>
            <span class="text-[8px] mt-1 uppercase font-black">Вақт</span>
        </button>
        <button onclick="showTab('learn')" class="nav-btn text-slate-500 flex flex-col items-center flex-1 transition-all" id="btn-learn">
            <i class="fas fa-book-open text-xl"></i>
            <span class="text-[8px] mt-1 uppercase font-black">Омӯзиш</span>
        </button>
        <button onclick="showTab('dua')" class="nav-btn text-slate-500 flex flex-col items-center flex-1 transition-all" id="btn-dua">
            <i class="fas fa-hands-praying text-xl"></i>
            <span class="text-[8px] mt-1 uppercase font-black">Дуоҳо</span>
        </button>
    </nav>

    <script>
        const hadiths = [
            { t: "Беҳтарини шумо касест, ки Қуръонро омӯзад ва ба дигарон омӯзонад.", s: "Бухорӣ" },
            { t: "Покӣ нишони имон аст.", s: "Муслим" },
            { t: "Дуо силоҳи мӯъмин аст.", s: "Абу Яьло" },
            { t: "Намоз нури мӯъмин аст.", s: "Муслим" }
        ];

        async function init() {
            const hIndex = new Date().getDate() % hadiths.length;
            document.getElementById('daily-hadith').innerText = `"${hadiths[hIndex].t}"`;
            document.getElementById('hadith-source').innerHTML = `<span class="h-[1px] w-4 bg-slate-700 mr-2"></span> ${hadiths[hIndex].s}`;
            
            const saved = localStorage.getItem('loc');
            if(saved) {
                const l = JSON.parse(saved);
                getTimes(l.lat, l.lon);
            } else {
                updateLocation();
            }
        }

        function updateLocation() {
            navigator.geolocation.getCurrentPosition(p => {
                const coords = {lat: p.coords.latitude, lon: p.coords.longitude};
                localStorage.setItem('loc', JSON.stringify(coords));
                getTimes(coords.lat, coords.lon);
            }, () => getTimes(38.53, 68.78)); // Душанбе по умолчанию
        }

        async function getTimes(lat, lon) {
            try {
                const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=3`);
                const d = await res.json();
                const t = d.data.timings;
                
                document.querySelector('.city-name').innerText = d.data.meta.timezone.split('/')[1] || "Тоҷикистон";
                
                const list = document.getElementById('prayer-list');
                const map = [
                    {id:'Fajr', name:'Бамдод', icon:'fa-sun-rising'},
                    {id:'Sunrise', name:'Вохӯрии офтоб', icon:'fa-sun'},
                    {id:'Dhuhr', name:'Пешин', icon:'fa-cloud-sun'},
                    {id:'Asr', name:'Аср', icon:'fa-cloud-moon'},
                    {id:'Maghrib', name:'Шом', icon:'fa-moon'},
                    {id:'Isha', name:'Хуфтан', icon:'fa-star-and-crescent'}
                ];
                
                list.innerHTML = "";
                map.forEach((item) => {
                    list.innerHTML += `
                        <div class="glass p-5 rounded-3xl flex items-center justify-between border-r-2 border-transparent hover:border-amber-500 transition-all">
                            <div class="flex items-center">
                                <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-amber-500 mr-4">
                                    <i class="fas ${item.icon}"></i>
                                </div>
                                <span class="text-sm font-bold text-slate-200">${item.name}</span>
                            </div>
                            <span class="text-xl font-black text-amber-400 tracking-tighter">${t[item.id]}</span>
                        </div>
                    `;
                });
            } catch (e) {
                console.log("Error fetching times");
            }
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab', 'text-amber-500'));
            document.getElementById('tab-'+id).classList.add('active');
            document.getElementById('btn-'+id).classList.add('active-tab');
        }

        init();
    </script>
</body>
</html>
