<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Isfara FM - 93.9FM РАДИОИ ИСФАРА</title>
    
    <!-- Отключаем кэш -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7a1cff;
            --secondary: #9d4dff;
            --accent: #FF6B35;
            --text: #FFFFFF;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-hover: rgba(255, 107, 53, 0.1);
            --card-bg: rgba(255, 255, 255, 0.03);
        }

        body {
            background: linear-gradient(145deg, #2a0b5e 0%, #4a1b9e 40%, #7a1cff 70%, #9d4dff 100%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            font-size: 15px;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.3;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255,107,53,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(122,28,255,0.15) 0%, transparent 50%);
            animation: smoothFloat 25s ease infinite alternate;
        }

        @keyframes smoothFloat {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.05); opacity: 0.4; }
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            cursor: pointer;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255,107,53,0.2));
        }

        .logo-text h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .logo-text p {
            font-size: 12px;
            color: #FFD700;
            font-weight: 500;
        }

        .menu-btn {
            background: var(--glass);
            border: none;
            border-radius: 12px;
            color: white;
            width: 44px;
            height: 44px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-btn:hover {
            background: rgba(255,107,53,0.2);
        }

        /* Меню */
        .side-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background: rgba(42, 11, 94, 0.98);
            backdrop-filter: blur(20px);
            transition: right 0.3s ease;
            z-index: 1000;
            padding: 80px 20px 30px;
            overflow-y: auto;
        }

        .side-menu.active {
            right: 0;
        }

        .menu-header {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 12px;
            margin-bottom: 25px;
            text-align: center;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            margin-bottom: 10px;
            background: var(--card-bg);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            border: 1px solid transparent;
        }

        .menu-item:hover {
            background: var(--glass-hover);
            border-color: var(--accent);
        }

        .menu-item i {
            color: var(--accent);
            font-size: 20px;
            width: 24px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* Основной контент */
        .main-content {
            flex: 1;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 20px 30px;
            width: 100%;
        }

        /* Плеер */
        .player-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .vinyl-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: rotate 15s linear infinite;
            animation-play-state: paused;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .wave-animation {
            position: absolute;
            bottom: -20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .wave-animation.active {
            opacity: 1;
        }

        .wave-bar {
            width: 5px;
            background: var(--accent);
            border-radius: 3px;
            animation: wave 1.2s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { height: 25px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 30px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 35px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 40px; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 35px; animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { height: 30px; animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { height: 25px; animation-delay: 0.6s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.4); }
        }

        .player-btn {
            background: var(--accent);
            border: none;
            border-radius: 50px;
            padding: 18px 40px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(255,107,53,0.3);
            margin: 15px 0 10px;
            min-width: 260px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 4px 20px rgba(255,107,53,0.3); }
            50% { transform: scale(1.02); box-shadow: 0 8px 30px rgba(255,107,53,0.5); }
            100% { transform: scale(1); box-shadow: 0 4px 20px rgba(255,107,53,0.3); }
        }

        .player-btn:hover {
            background: #ff5a24;
            animation: none;
            transform: scale(1.02);
        }

        .status-text {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
        }

        /* Инфо-блоки */
        .info-block {
            background: var(--glass);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .info-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .weather-temp {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .weather-details {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .currency-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 15px;
        }

        .currency-item:last-child {
            border-bottom: none;
        }

        .currency-code {
            font-weight: 600;
            color: var(--accent);
        }

        .currency-note {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            margin-top: 10px;
            text-align: right;
        }

        /* Новости */
        .news-block {
            background: var(--glass);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
        }

        .news-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .news-item {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .news-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .news-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .news-excerpt {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .news-full-link {
            font-size: 12px;
            color: var(--accent);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
            cursor: pointer;
            display: inline-block;
        }

        .news-full-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .all-news-btn {
            display: block;
            width: fit-content;
            margin: 20px auto 5px;
            padding: 12px 30px;
            background: transparent;
            border: 1.5px solid var(--accent);
            border-radius: 40px;
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .all-news-btn:hover {
            background: var(--accent);
            color: white;
        }

        /* Реклама */
        .ad-section {
            margin: 20px 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .ad-top-text {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            font-size: 14px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .ad-carousel {
            position: relative;
            width: 100%;
            height: 160px;
        }

        .ad-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
            background-size: cover;
            background-position: center;
        }

        .ad-slide.active {
            opacity: 1;
            z-index: 2;
        }

        .ad-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px 15px 15px;
        }

        .ad-content h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .ad-link {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .ad-link:hover {
            background: #ff5a24;
        }

        .ad-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px 0;
            background: rgba(0,0,0,0.2);
        }

        .ad-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.2s;
        }

        .ad-dot.active {
            background: var(--accent);
            transform: scale(1.2);
        }

        /* Соцсети */
        .social-section {
            margin: 20px 0;
            text-align: center;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            transition: all 0.2s;
            text-decoration: none;
        }

        .social-icon:hover {
            transform: translateY(-3px);
        }

        .telegram { background: #0088cc; }
        .instagram { background: linear-gradient(45deg, #405DE6, #833AB4, #E1306C); }
        .youtube { background: #FF0000; }
        .whatsapp { background: #25D366; }

        /* Контент-секции */
        .content-section {
            display: none;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
        }

        .content-section.active {
            display: block;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Команда */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .team-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s;
        }

        .team-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            background: var(--glass-hover);
        }

        .team-card img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .team-card h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .team-card p {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 8px;
        }

        .team-detail {
            font-size: 12px;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            opacity: 0.8;
        }

        /* Партнёры */
        .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .partner-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s;
        }

        .partner-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            background: var(--glass-hover);
        }

        .partner-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 12px;
            filter: brightness(0) invert(1);
        }

        .partner-card h3 {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .partner-link {
            font-size: 12px;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* Расписание */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        @media (min-width: 600px) {
            .days-grid {
                grid-template-columns: repeat(7, 1fr);
            }
        }

        .day-btn {
            padding: 8px 4px;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .day-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .program-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .program-time {
            color: var(--accent);
            font-weight: 500;
        }

        /* Настройки */
        .settings-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .settings-group {
            margin-bottom: 25px;
        }

        .settings-group-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .settings-info {
            flex: 1;
        }

        .settings-label {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .settings-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        .language-buttons {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: 30px;
            padding: 8px 16px;
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--accent);
            color: white;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
        }

        .about-block {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
        }

        .about-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        /* Подробная информация о члене команды */
        .team-detail-view {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .team-detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .team-detail-header img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
        }

        .team-detail-info h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .team-detail-info p {
            color: var(--accent);
            font-size: 16px;
        }

        .team-detail-bio {
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: 30px;
            padding: 10px 20px;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: var(--accent);
            color: white;
        }

        /* Уведомление */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 14px 24px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 3000;
            border: 1px solid var(--accent);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;
            white-space: nowrap;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* Футер */
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            font-size: 13px;
            margin-top: auto;
        }

        .footer-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>

    <!-- Шапка -->
    <header id="logoHome">
        <div class="logo-container">
            <img src="https://i.ibb.co/39MLN2z8/photo-2026-01-28-08-19-22-no-bg-preview-carve-photos.png" class="logo">
            <div class="logo-text">
                <h1>Isfara FM</h1>
                <p>93.9FM</p>
            </div>
        </div>
        <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
    </header>

    <!-- Меню с иконками -->
    <div class="side-menu" id="sideMenu">

        function showNewsComingSoon() {
            const message = currentLang === 'tg' ? 'Ба зудӣ автоматикӣ кор мекунад 🤖' : 'Скоро заработает автоматически 🤖';
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function renderTeam() {
            const grid = document.getElementById('teamGrid');
            grid.innerHTML = '';
            teamData.forEach((member, index) => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.setAttribute('data-index', index);
                card.innerHTML = `
                    <img src="https://via.placeholder.com/90/FF6B35/ffffff?text=${member.name.charAt(0)}">
                    <h3>${member.name}</h3>
                    <p data-tg="${member.role_tg}" data-ru="${member.role_ru}"></p>
                    <div class="team-detail"><i class="fas fa-chevron-down"></i> <span data-tg="Муфассал" data-ru="Подробнее"></span></div>
                `;
                card.addEventListener('click', () => showTeamDetail(index));
                grid.appendChild(card);
            });
        }

        function showTeamDetail(index) {
            const member = teamData[index];
            const mainView = document.getElementById('teamMainView');
            const detailView = document.getElementById('teamDetailView');
            
            mainView.style.display = 'none';
            detailView.style.display = 'block';
            
            detailView.innerHTML = `
                <div class="back-btn" onclick="hideTeamDetail()"><i class="fas fa-arrow-left"></i> <span data-tg="Бақайд" data-ru="Назад"></span></div>
                <div class="team-detail-header">
                    <img src="https://via.placeholder.com/120/FF6B35/ffffff?text=${member.name.charAt(0)}">
                    <div class="team-detail-info">
                        <h2>${member.name}</h2>
                        <p data-tg="${member.role_tg}" data-ru="${member.role_ru}"></p>
                    </div>
                </div>
                <div class="team-detail-bio" data-tg="${member.bio_tg}" data-ru="${member.bio_ru}"></div>
                <div style="display: flex; gap: 15px; justify-content: center;">
                    ${member.instagram ? `<a href="${member.instagram}" target="_blank" class="social-icon instagram" style="width: 40px; height: 40px;"><i class="fab fa-instagram"></i></a>` : ''}
                    ${member.telegram ? `<a href="${member.telegram}" target="_blank" class="social-icon telegram" style="width: 40px; height: 40px;"><i class="fab fa-telegram-plane"></i></a>` : ''}
                </div>
            `;
            
            setLanguage(currentLang);
        }

        function hideTeamDetail() {
            document.getElementById('teamMainView').style.display = 'block';
            document.getElementById('teamDetailView').style.display = 'none';
        }

        function renderPartners() {
            const grid = document.getElementById('partnersGrid');
            grid.innerHTML = '';
            partnersData.forEach(partner => {
                const card = document.createElement('a');
                card.href = partner.url;
                card.target = '_blank';
                card.className = 'partner-card';
                card.innerHTML = `
                    <img src="${partner.logo}" alt="${partner.name}">
                    <h3>${partner.name}</h3>
                    <div class="partner-link"><i class="fas fa-external-link-alt"></i> <span data-tg="Сомона" data-ru="Сайт"></span></div>
                `;
                grid.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            getWeather();
            getCurrency();
            setupMenu();
            setupPlayer();
            setupSchedule();
            setupAdCarousel();
            setupSettings();
            
            document.getElementById('logoHome').addEventListener('click', (e) => {
                if(e.target.tagName !== 'BUTTON' && !e.target.closest('.menu-btn')) {
                    showSection('main');
                }
            });
            
            document.querySelectorAll('.menu-item').forEach(item => {
                let section = item.getAttribute('data-section');
                if(section) item.addEventListener('click', () => showSection(section));
            });
            
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.addEventListener('click', function(){
                    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    showSchedule(this.getAttribute('data-day'));
                });
            });
            
            renderTeam();
            renderPartners();
            showSchedule('monday');
            setLanguage('tg');
            document.querySelector('.lang-btn')?.classList.add('active');
        });

        function setupSettings() {
            document.getElementById('langTg').addEventListener('click', function() {
                setLanguage('tg');
                document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
            });
            
            document.getElementById('langRu').addEventListener('click', function() {
                setLanguage('ru');
                document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
            });
            
            document.getElementById('autoplayCheckbox').checked = localStorage.getItem('autoplay') === 'true';
            document.getElementById('notificationsCheckbox').checked = localStorage.getItem('notifications') !== 'false';
            document.getElementById('darkThemeCheckbox').checked = localStorage.getItem('darkTheme') !== 'false';
            
            document.getElementById('autoplayCheckbox').addEventListener('change', function() {
                localStorage.setItem('autoplay', this.checked);
            });
            document.getElementById('notificationsCheckbox').addEventListener('change', function() {
                localStorage.setItem('notifications', this.checked);
            });
            document.getElementById('darkThemeCheckbox').addEventListener('change', function() {
                localStorage.setItem('darkTheme', this.checked);
            });
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-tg]').forEach(el => {
                if(el.tagName === 'P' && el.getAttribute('data-tg')?.includes('<strong>')) {
                    el.innerHTML = lang === 'tg' ? el.getAttribute('data-tg') : el.getAttribute('data-ru');
                } else {
                    el.textContent = lang === 'tg' ? el.getAttribute('data-tg') : el.getAttribute('data-ru');
                }
            });
            
            document.querySelectorAll('.menu-item').forEach(item => {
                const span = item.querySelector('span');
                if(span) span.textContent = lang === 'tg' ? item.getAttribute('data-tg') : item.getAttribute('data-ru');
            });
            
            const playSpan = document.querySelector('#playBtn span');
            if(playSpan) playSpan.textContent = lang === 'tg' ? 'Гӯш кардан' : 'Слушать';
            
            if(!isPlaying) {
                document.getElementById('status').textContent = lang === 'tg' ? 'Барои гӯш кардан тугмаро пахш кунед' : 'Нажмите кнопку для прослушивания';
            }
            
            showSchedule(document.querySelector('.day-btn.active')?.getAttribute('data-day') || 'monday');
        }

        function getWeather(){
            fetch(`https://api.openweathermap.org/data/2.5/weather?q=Isfara,TJ&units=metric&appid=${WEATHER_API_KEY}`)
                .then(r => r.json()).then(d => {
                    if(d.main){
                        document.getElementById('weatherTemp').innerText = Math.round(d.main.temp)+'°C';
                        document.getElementById('weatherDetails').innerHTML = (currentLang=='tg'?`Намӣ: ${d.main.humidity}% | Шамол: ${d.wind.speed} м/с`:`Влажность: ${d.main.humidity}% | Ветер: ${d.wind.speed} м/с`);
                    }
                }).catch(() => {
                    document.getElementById('weatherTemp').innerText = '+18°C';
                    document.getElementById('weatherDetails').innerHTML = currentLang=='tg'?'Намӣ: 65% | Шамол: 3 м/с':'Влажность: 65% | Ветер: 3 м/с';
                });
        }

        function getCurrency(){
            fetch('https://api.exchangerate-api.com/v4/latest/USD')
                .then(r => r.json()).then(d => {
                    let tjs = d.rates.TJS || 10.95;
                    document.getElementById('usdRate').innerText = tjs.toFixed(2);
                    document.getElementById('eurRate').innerText = (tjs*1.08).toFixed(2);
                    document.getElementById('rubRate').innerText = (tjs*0.012).toFixed(2);
                }).catch(() => {
                    document.getElementById('usdRate').innerText = '10.95';
                    document.getElementById('eurRate').innerText = '11.82';
                    document.getElementById('rubRate').innerText = '0.12';
                });
        }

        function setupMenu(){
            document.getElementById('menuBtn').addEventListener('click', (e)=>{
                e.stopPropagation();
                document.getElementById('sideMenu').classList.add('active');
                document.getElementById('overlay').classList.add('active');
            });
            document.getElementById('overlay').addEventListener('click', ()=>{
                document.getElementById('sideMenu').classList.remove('active');
                document.getElementById('overlay').classList.remove('active');
            });
        }

        function showSection(section){
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById('mainContent').style.display = 'none';
            if(section === 'main') document.getElementById('mainContent').style.display = 'block';
            else {
                const map = {schedule:'scheduleSection', about:'aboutSection', team:'teamSection', partners:'partnersSection', support:'supportSection', settings:'settingsSection'};
                if(map[section]) document.getElementById(map[section]).classList.add('active');
            }
            document.getElementById('sideMenu').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        function setupPlayer(){
            const audio = document.getElementById('radioStream');
            const btn = document.getElementById('playBtn');
            const status = document.getElementById('status');
            const vinyl = document.getElementById('vinyl');
            const wave = document.getElementById('waveAnimation');
            btn.addEventListener('click', ()=>{
                if(!isPlaying){
                    audio.play().then(()=>{
                        isPlaying = true;
                        btn.innerHTML = '<i class="fas fa-pause"></i> <span>' + (currentLang=='tg'?'Таваққуф':'Пауза') + '</span>';
                        wave.classList.add('active');
                        vinyl.classList.add('playing');
                        status.textContent = currentLang=='tg'?'Гӯш карда истодаед...':'Слушаем...';
                    }).catch(()=> status.textContent = currentLang=='tg'?'Хатогӣ':'Ошибка');
                } else {
                    audio.pause();
                    isPlaying = false;
                    btn.innerHTML = '<i class="fas fa-play"></i> <span>' + (currentLang=='tg'?'Гӯш кардан':'Слушать') + '</span>';
                    wave.classList.remove('active');
                    vinyl.classList.remove('playing');
                    status.textContent = currentLang=='tg'?'Барои гӯш кардан тугмаро пахш кунед':'Нажмите кнопку';
                }
            });
            audio.addEventListener('waiting', ()=> status.textContent = currentLang=='tg'?'Интизор шавед...':'Буферизация...');
            audio.addEventListener('error', ()=>{
                status.textContent = currentLang=='tg'?'Хатогӣ':'Ошибка';
                isPlaying = false;
                btn.innerHTML = '<i class="fas fa-play"></i> <span>' + (currentLang=='tg'?'Гӯш кардан':'Слушать') + '</span>';
                wave.classList.remove('active');
                vinyl.classList.remove('playing');
            });
        }

        function showSchedule(day){
            const list = document.getElementById('programList');
            list.innerHTML = '';
            if(schedules[day]){
                schedules[day].forEach(item => {
                    let div = document.createElement('div');
                    div.className = 'program-item';
                    div.innerHTML = `<span class="program-time">${item.time}</span><span>${item.title}</span>`;
                    list.appendChild(div);
                });
            }
        }

        function setupSchedule(){
            showSchedule('monday');
        }

        function setupAdCarousel(){
            let current = 0;
            const slides = document.querySelectorAll('.ad-slide');
            const dots = document.querySelectorAll('.ad-dot');
            if(!slides.length) return;
            setInterval(()=>{
                slides[current].classList.remove('active');
                dots[current].classList.remove('active');
                current = (current + 1) % slides.length;
                slides[current].classList.add('active');
                dots[current].classList.add('active');
            }, 5000);
        }
    </script>
