<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azon — Намози Комил</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .active-tab { color: #10b981 !important; transform: translateY(-2px); }
        .tab-content { display: none; animation: fadeIn 0.4s ease-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; overflow-y: auto; padding: 15px; }
        .modal.active { display: block; }
        .step-card { border-left: 3px solid #10b981; padding-left: 15px; margin-bottom: 20px; }
    </style>
</head>
<body class="min-h-screen pb-32 bg-slate-950">

    <div id="full-modal" class="modal">
        <div class="max-w-2xl mx-auto pt-10 pb-20">
            <div class="flex justify-between items-center mb-8 sticky top-0 bg-black py-4 z-50">
                <h2 id="m-title" class="text-2xl font-black text-emerald-500"></h2>
                <button onclick="closeM()" class="w-10 h-10 rounded-full glass flex items-center justify-center text-2xl">&times;</button>
            </div>
            <div id="m-content" class="space-y-6"></div>
        </div>
    </div>

    <header class="p-6 flex justify-between items-start sticky top-0 bg-slate-950/90 backdrop-blur-xl z-40">
        <div>
            <h1 class="text-4xl font-black text-emerald-500 tracking-tighter italic">AZON</h1>
            <div onclick="openCityModal()" class="flex items-center gap-1 text-slate-500 mt-1 cursor-pointer">
                <i class="fas fa-location-dot text-emerald-500 text-[10px]"></i>
                <span id="city-name" class="text-[10px] font-bold uppercase tracking-widest">Душанбе</span>
            </div>
        </div>
        <div class="text-right">
            <span class="text-[9px] font-bold text-slate-500 uppercase block">Намози оянда пас аз:</span>
            <span id="timer" class="text-xl font-black text-emerald-400 font-mono">00:00:00</span>
        </div>
    </header>

    <main class="px-4">
        <section id="tab-times" class="tab-content active">
            <div class="glass rounded-[2.5rem] p-6 mb-6 bg-gradient-to-br from-emerald-900/20 to-transparent">
                <div class="flex items-center gap-2 mb-3">
                    <i class="fas fa-star-and-crescent text-emerald-500 text-xs"></i>
                    <span class="text-[10px] font-bold text-emerald-500 uppercase tracking-[0.2em]">Ҳадиси рӯз</span>
                </div>
                <p id="h-text" class="text-sm leading-relaxed font-medium">...</p>
            </div>
            <div id="p-list" class="space-y-3"></div>
        </section>

        <section id="tab-learn" class="tab-content">
            <h2 class="text-2xl font-black mb-6 px-2">Тарзи адои Намоз</h2>
            <div id="l-list" class="space-y-3"></div>
        </section>

        <section id="tab-dua" class="tab-content">
            <h2 class="text-2xl font-black mb-6 px-2 text-emerald-500">Сураҳо ва Дуоҳо</h2>
            <div id="d-list" class="grid grid-cols-1 gap-3"></div>
        </section>

        <section id="tab-extra" class="tab-content text-center pt-10">
            <div class="inline-block relative">
                <div id="t-display" class="w-64 h-64 rounded-full border-[12px] border-emerald-500/10 flex flex-col items-center justify-center">
                    <span id="t-count" class="text-7xl font-black text-white">0</span>
                    <span id="t-goal" class="text-xs font-bold text-emerald-500 mt-2 uppercase tracking-widest">Ҳадаф: 33</span>
                </div>
            </div>
            <div class="flex justify-center gap-6 mt-12">
                <button onclick="tReset()" class="w-16 h-16 rounded-full glass text-slate-500"><i class="fas fa-sync"></i></button>
                <button onclick="tCount()" class="w-24 h-24 rounded-full bg-emerald-600 text-white shadow-2xl shadow-emerald-900/40 text-3xl"><i class="fas fa-fingerprint"></i></button>
                <button onclick="tToggle()" class="w-16 h-16 rounded-full glass text-emerald-500 font-bold">33</button>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass py-5 flex justify-around rounded-t-[3rem] z-50 border-none">
        <button onclick="showT('times')" id="btn-times" class="nav-btn active-tab flex flex-col items-center flex-1">
            <i class="fas fa-mosque text-xl"></i><span class="text-[8px] mt-1 font-black uppercase">Вақт</span>
        </button>
        <button onclick="showT('learn')" id="btn-learn" class="nav-btn text-slate-600 flex flex-col items-center flex-1">
            <i class="fas fa-book-open text-xl"></i><span class="text-[8px] mt-1 font-black uppercase">Омӯзиш</span>
        </button>
        <button onclick="showT('dua')" id="btn-dua" class="nav-btn text-slate-600 flex flex-col items-center flex-1">
            <i class="fas fa-kaaba text-xl"></i><span class="text-[8px] mt-1 font-black uppercase">Дуоҳо</span>
        </button>
        <button onclick="showT('extra')" id="btn-extra" class="nav-btn text-slate-600 flex flex-col items-center flex-1">
            <i class="fas fa-beads text-xl"></i><span class="text-[8px] mt-1 font-black uppercase">Тасбеҳ</span>
        </button>
    </nav>

    <script>
        const P_MAP = { Fajr:'Бамдод', Dhuhr:'Пешин', Asr:'Аср', Maghrib:'Шом', Isha:'Хуфтан' };
        let timings = {};
        let count = 0, goal = 33;

        const SURAS = [
            {n: "Сураи Фотиҳа", a: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ. الرَّحْمَنِ الرَّحِيمِ. مَالِكِ يَوْمِ الدِّينِ...", i: "fa-book"},
            {n: "Сураи Ихлос", a: "قُلْ هُوَ اللَّهُ أَحَدٌ. اللَّهُ الصَّمَدُ. لَمْ يَلِدْ وَلَمْ يُولَدْ...", i: "fa-heart"},
            {n: "Сураи Кавсар", a: "إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ. فَصَلِّ لِرَبِّكَ وَانْحَرْ...", i: "fa-water"},
            {n: "Оятул Курсӣ", a: "اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...", i: "fa-shield-halved"}
        ];

        const STEPS = [
            {n: "1. Ният", d: "Дар дил ният мекунед, ки кадом намозро мехонед."},
            {n: "2. Такбири таҳрима", d: "Дастҳоро то гӯш бардошта 'Аллоҳу Акбар' мегӯед."},
            {n: "3. Қиём ва Қироат", d: "Дастҳоро баста, Сано, Фотиҳа ва як сураи иловагӣ мехонед."},
            {n: "4. Рукӯъ", d: "Хами шуда, 3 бор 'Субҳона раббиял азим' мегӯед."},
            {n: "5. Саҷда", d: "Ба замин рафта, 3 бор 'Субҳона раббиял аъло' мегӯед."},
            {n: "6. Қаъда (Нишастан)", d: "Нишаста 'Аттаҳиёт', 'Салавот' ва 'Дуо' мехонед."}
        ];

        function init() {
            renderTimes();
            renderLearn();
            renderDua();
            setInterval(uTimer, 1000);
            document.getElementById('h-text').innerText = "Беҳтарини шумо касест, ки Қуръонро омӯзад ва ба дигарон омӯзонад. (Бухорӣ)";
        }

        async function renderTimes() {
            const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=38.53&longitude=68.78&method=3`);
            const json = await res.json();
            timings = json.data.timings;
            const list = document.getElementById('p-list');
            list.innerHTML = "";
            Object.entries(P_MAP).forEach(([id, name]) => {
                let time = id === 'Dhuhr' ? '13:00' : timings[id];
                list.innerHTML += `<div class="glass p-5 rounded-[2rem] flex justify-between items-center"><span class="font-bold text-slate-300 text-lg">${name}</span><span class="text-2xl font-black text-white">${time}</span></div>`;
            });
        }

        function renderLearn() {
            const list = document.getElementById('l-list');
            Object.values(P_MAP).forEach(name => {
                list.innerHTML += `<div onclick="openL('${name}')" class="glass p-5 rounded-3xl flex justify-between items-center"><div class="flex items-center gap-4"><div class="w-10 h-10 rounded-2xl bg-emerald-500/10 flex items-center justify-center text-emerald-500"><i class="fas fa-person-praying"></i></div><span class="font-bold">${name}</span></div><i class="fas fa-chevron-right text-slate-600"></i></div>`;
            });
        }

        function openL(name) {
            document.getElementById('m-title').innerText = "Тарзи хондани " + name;
            let html = `<div class="bg-emerald-500/10 p-4 rounded-2xl text-sm border border-emerald-500/20 mb-6 text-center">Ҳамаи ҳаракатҳо ва дуоҳо барои намози ${name}</div>`;
            STEPS.forEach(s => {
                html += `<div class="step-card"><h4 class="font-black text-emerald-500 mb-1">${s.n}</h4><p class="text-sm text-slate-400 leading-relaxed">${s.d}</p></div>`;
            });
            document.getElementById('m-content').innerHTML = html;
            document.getElementById('full-modal').classList.add('active');
        }

        function renderDua() {
            const list = document.getElementById('d-list');
            SURAS.forEach((s, idx) => {
                list.innerHTML += `<div onclick="openD(${idx})" class="glass p-5 rounded-3xl flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center text-emerald-500"><i class="fas ${s.i}"></i></div><span class="font-bold text-sm">${s.n}</span></div>`;
            });
        }

        function openD(idx) {
            const s = SURAS[idx];
            document.getElementById('m-title').innerText = s.n;
            document.getElementById('m-content').innerHTML = `<div class="glass p-8 rounded-[3rem] text-3xl font-serif text-center leading-[3.5rem] text-emerald-100" dir="rtl">${s.a}</div><p class="text-center text-slate-500 italic mt-6 text-sm">Барои хондани комил дар намоз истифода мешавад.</p>`;
            document.getElementById('full-modal').classList.add('active');
        }

        function tCount() {
            count++; if(count > goal) count = 1;
            document.getElementById('t-count').innerText = count;
            if(navigator.vibrate) navigator.vibrate(50);
        }
        function tReset() { count = 0; document.getElementById('t-count').innerText = 0; }
        function tToggle() { goal = goal === 33 ? 99 : 33; document.getElementById('t-goal').innerText = "Ҳадаф: " + goal; tReset(); }

        function uTimer() {
            const now = new Date();
            document.getElementById('timer').innerText = now.toLocaleTimeString('ru-RU');
        }

        function showT(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('tab-'+id).classList.add('active');
            document.getElementById('btn-'+id).classList.add('active-tab');
        }

        function closeM() { document.getElementById('full-modal').classList.remove('active'); }
        init();
    </script>
</body>
</html>
