<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Sughd Radio — Радиои Суғд</title>
    
    <!-- Отключаем кэш -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --accent: #FF6B35;
            --accent-hover: #ff8c42;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --border-glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Шапка */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 12px;
        }

        .app-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .menu-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
            font-size: 20px;
        }

        .menu-btn:hover {
            background: rgba(255, 107, 53, 0.15);
            border-color: var(--accent);
        }

        /* Боковое меню */
        .side-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 320px;
            height: 100vh;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1000;
            transition: right 0.3s ease;
            padding: 80px 24px 30px;
            border-left: 1px solid var(--border-glass);
        }

        .side-menu.active {
            right: 0;
        }

        .menu-header {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 12px;
            color: var(--text-secondary);
        }

        .menu-item:hover {
            color: var(--accent);
            transform: translateX(4px);
        }

        .menu-item i {
            width: 24px;
            font-size: 18px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* Основной контент */
        .container {
            flex: 1;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            width: 100%;
        }

        /* Винил */
        .vinyl-section {
            text-align: center;
            margin-bottom: 24px;
        }
        .vinyl-disc {
            width: 140px;
            height: 140px;
            margin: 0 auto 12px;
            position: relative;
        }
        .vinyl-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: rotateVinyl 8s linear infinite;
            animation-play-state: paused;
            box-shadow: 0 0 20px rgba(255,107,53,0.3);
            border: 2px solid var(--accent);
        }
        .vinyl-img.playing {
            animation-play-state: running;
        }
        @keyframes rotateVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .current-station-name {
            font-size: 18px;
            font-weight: 600;
            margin-top: 8px;
        }

        /* Карточка радио */
        .radio-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .radio-card:hover {
            border-color: var(--accent);
            transform: translateX(4px);
        }
        .radio-info {
            flex: 1;
        }
        .radio-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .radio-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .play-btn {
            background: var(--accent);
            border: none;
            border-radius: 40px;
            padding: 8px 18px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 90px;
            justify-content: center;
        }
        .play-btn.playing {
            background: #ff5a24;
            box-shadow: 0 0 10px rgba(255,107,53,0.5);
        }

        /* Слайдер рекламы */
        .ad-slider {
            margin: 20px 0;
            position: relative;
        }
        .ad-container {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
        }
        .ad-slides {
            display: flex;
            transition: transform 0.5s ease;
        }
        .ad-slide {
            flex: 0 0 100%;
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            min-height: 180px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 20px;
        }
        .ad-content {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 20px;
            text-align: center;
        }
        .ad-order-btn {
            background: var(--accent);
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 6px;
        }
        .ad-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            cursor: pointer;
        }
        .dot.active {
            background: var(--accent);
            width: 20px;
            border-radius: 4px;
        }

        /* Курс валют */
        .currency-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
        }
        .currency-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .currency-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-glass);
        }
        .currency-row:last-child {
            border-bottom: none;
        }
        .currency-value {
            font-weight: 600;
            color: var(--accent);
        }

        /* Предложить радио */
        .suggest-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .suggest-btn {
            background: transparent;
            border: 1.5px solid var(--accent);
            border-radius: 40px;
            padding: 10px 20px;
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        /* Соцсети */
        .social-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 12px;
        }
        .social-icon {
            color: var(--text-secondary);
            font-size: 24px;
            transition: all 0.2s;
        }
        .social-icon:hover {
            color: var(--accent);
        }

        /* Футер */
        footer {
            text-align: center;
            padding: 20px 16px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-glass);
            margin-top: auto;
        }
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 2000;
            border: 1px solid var(--accent);
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <img src="https://via.placeholder.com/40/FF6B35/ffffff?text=SR" alt="Logo" class="logo" id="logoImg">
        <span class="app-title" id="appTitle">Sughd Radio</span>
    </div>
    <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
</header>

<!-- Боковое меню -->
<div class="side-menu" id="sideMenu">
    <div class="menu-header" data-tg="Меню" data-ru="Меню">Меню</div>
    <div class="menu-item" id="menuHome"><i class="fas fa-home"></i><span data-tg="Асосӣ" data-ru="Главная">Главная</span></div>
    <div class="menu-item" id="menuSuggest"><i class="fas fa-plus-circle"></i><span data-tg="Пешниҳоди радио" data-ru="Предложить радио">Предложить радио</span></div>
    <div class="menu-item" id="menuLang"><i class="fas fa-globe"></i><span data-tg="Забон" data-ru="Язык">Язык</span></div>
    <div class="menu-item" id="menuShare"><i class="fas fa-share-alt"></i><span data-tg="Мубодила" data-ru="Поделиться">Поделиться</span></div>
    <div class="menu-item" id="menuRate"><i class="fas fa-star"></i><span data-tg="Баҳо диҳед" data-ru="Оценить">Оценить</span></div>
    <div class="menu-item" id="menuAbout"><i class="fas fa-info-circle"></i><span data-tg="Дар бораи" data-ru="О приложении">О приложении</span></div>
    <div class="menu-item" id="menuSupport"><i class="fas fa-headset"></i><span data-tg="Дастгирӣ" data-ru="Поддержка">Поддержка</span></div>
</div>
<div class="overlay" id="overlay"></div>

<main class="container" id="mainContent">
    <!-- Винил -->
    <div class="vinyl-section">
        <div class="vinyl-disc">
            <img src="https://via.placeholder.com/140/FF6B35/ffffff?text=Radio" alt="Vinyl" class="vinyl-img" id="vinylImg">
        </div>
        <div class="current-station-name" id="currentStationName">Радиои интихобшуда</div>
    </div>

    <!-- Список радиостанций -->
    <div id="radiosList"></div>

    <!-- Предложить радио -->
    <div class="suggest-card">
        <i class="fas fa-microphone-alt" style="font-size: 24px; color: var(--accent); margin-bottom: 8px; display: block;"></i>
        <div data-tg="Радиои шумо нест?" data-ru="Нет твоего радио?">Нет твоего радио?</div>
        <div style="font-size: 13px; opacity: 0.7;" data-tg="Ба мо нависед, мо илова мекунем" data-ru="Напиши нам, мы добавим">Напиши нам, мы добавим</div>
        <button class="suggest-btn" id="suggestBtn"><i class="fab fa-telegram-plane"></i> <span data-tg="Пешниҳод" data-ru="Предложить">Предложить</span></button>
    </div>

    <!-- Реклама слайдер -->
    <div class="ad-slider">
        <div class="ad-container">
            <div class="ad-slides" id="adSlides"></div>
        </div>
        <div class="ad-dots" id="adDots"></div>
    </div>

    <!-- Курс валют -->
    <div class="currency-card">
        <div class="currency-title"><i class="fas fa-coins"></i> <span data-tg="Курби асъор" data-ru="Курс валют">Курс валют</span></div>
        <div class="currency-row"><span>100 USD →</span><span class="currency-value" id="usdRate">—</span> <span data-tg="сомонӣ" data-ru="сомони">сомони</span></div>
        <div class="currency-row"><span>100 EUR →</span><span class="currency-value" id="eurRate">—</span> <span data-tg="сомонӣ" data-ru="сомони">сомони</span></div>
        <div class="currency-row"><span>1000 RUB →</span><span class="currency-value" id="rubRate">—</span> <span data-tg="сомонӣ" data-ru="сомони">сомони</span></div>
    </div>

    <!-- Соцсети -->
    <div class="social-card">
        <div data-tg="Мо дар шабакаҳои иҷтимоӣ" data-ru="Мы в соцсетях">Мы в соцсетях</div>
        <div class="social-icons">
            <a href="#" id="socialTelegram" class="social-icon" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="#" id="socialInstagram" class="social-icon" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="#" id="socialYoutube" class="social-icon" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
    </div>
</main>

<footer>
    <div>© 2026 | Kurush Digital</div>
    <div style="font-size: 11px; margin-top: 4px;" data-tg="Таҳия ва дастгирӣ" data-ru="Разработка и поддержка">Разработка и поддержка</div>
</footer>

<audio id="audioPlayer"></audio>

<script>
    // ===== НАСТРОЙКИ (меняй здесь) =====
    const APP_NAME = 'Sughd Radio';
    const LOGO_URL = 'https://via.placeholder.com/40/FF6B35/ffffff?text=SR';
    const TELEGRAM_SUPPORT = 'https://t.me/kurush_digital';
    
    const SOCIAL = {
        telegram: 'https://t.me/kurush_digital',
        instagram: 'https://instagram.com/kurush_digital',
        youtube: 'https://youtube.com/@kurush_digital'
    };
    
    // Радиостанции (лого - заглушки, заменишь)
    const RADIOS = [
        { name: 'Радио Исфара', name_tg: 'Радиои Исфара', name_ru: 'Радио Исфара', freq: '93.9 FM', city: 'Исфара', stream: 'https://c34.radioboss.fm:8880/stream', logo: 'https://via.placeholder.com/140/FF6B35/ffffff?text=Isfara' },
        { name: 'Радио Канд', name_tg: 'Радиои Канд', name_ru: 'Радио Канд', freq: '87.7 FM', city: 'Канд', stream: 'https://listen7.myradio24.com/tamish', logo: 'https://via.placeholder.com/140/FF6B35/ffffff?text=Kand' },
        { name: 'Радио Диёр', name_tg: 'Радиои Диёр', name_ru: 'Радио Диёр', freq: '105.5 FM', city: 'Диёр', stream: 'https://c16.radioboss.fm/stream/234', logo: 'https://via.placeholder.com/140/FF6B35/ffffff?text=Diyor' },
        { name: 'Радио Пайванд', name_tg: 'Радиои Пайванд', name_ru: 'Радио Пайванд', freq: '100.6 FM', city: 'Пайванд', stream: 'https://c6.radioboss.fm/stream/234', logo: 'https://via.placeholder.com/140/FF6B35/ffffff?text=Payvand' }
    ];
    
    // Рекламные слайды (картинки-заглушки, заменишь)
    const ADS = [
        { image: 'https://via.placeholder.com/600x200/FF6B35/ffffff?text=Реклама+1', text: 'Реклама на радио' },
        { image: 'https://via.placeholder.com/600x200/FF6B35/ffffff?text=Реклама+2', text: 'Спонсорство' },
        { image: 'https://via.placeholder.com/600x200/FF6B35/ffffff?text=Реклама+3', text: 'Партнёрство' }
    ];
    // ===== КОНЕЦ НАСТРОЕК =====
    
    let currentLang = 'tg';
    let currentAudio = null;
    let currentPlayingIndex = -1;
    let activeBtn = null;
    let currentAdSlide = 0;
    const audioPlayer = document.getElementById('audioPlayer');
    const vinylImg = document.getElementById('vinylImg');
    const currentStationNameSpan = document.getElementById('currentStationName');
    
    // Установка языка
    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('[data-tg]').forEach(el => {
            el.textContent = lang === 'tg' ? el.getAttribute('data-tg') : el.getAttribute('data-ru');
        });
        renderRadioList();
        updateVinylAndName();
    }
    
    function updateVinylAndName() {
        if (currentPlayingIndex !== -1) {
            const radio = RADIOS[currentPlayingIndex];
            vinylImg.src = radio.logo;
            currentStationNameSpan.textContent = currentLang === 'tg' ? radio.name_tg : radio.name_ru;
        } else {
            vinylImg.src = 'https://via.placeholder.com/140/FF6B35/ffffff?text=Radio';
            currentStationNameSpan.textContent = currentLang === 'tg' ? 'Радиои интихобшуда' : 'Выберите радио';
        }
    }
    
    function renderRadioList() {
        const container = document.getElementById('radiosList');
        container.innerHTML = '';
        RADIOS.forEach((radio, idx) => {
            const card = document.createElement('div');
            card.className = 'radio-card';
            card.innerHTML = `
                <div class="radio-info">
                    <div class="radio-name">${currentLang === 'tg' ? radio.name_tg : radio.name_ru}</div>
                    <div class="radio-meta">${radio.freq} | ${radio.city}</div>
                </div>
                <button class="play-btn" data-index="${idx}"><i class="fas fa-play"></i> ${currentLang === 'tg' ? 'Гӯш кардан' : 'Слушать'}</button>
            `;
            container.appendChild(card);
        });
        document.querySelectorAll('.play-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.dataset.index);
                playRadio(idx, btn);
            });
        });
    }
    
    function playRadio(index, btnElement) {
        const radio = RADIOS[index];
        if (currentPlayingIndex === index && !audioPlayer.paused) {
            audioPlayer.pause();
            updateButtonState(activeBtn, false);
            currentPlayingIndex = -1;
            activeBtn = null;
            vinylImg.classList.remove('playing');
            updateVinylAndName();
            return;
        }
        if (audioPlayer) audioPlayer.pause();
        if (activeBtn) updateButtonState(activeBtn, false);
        audioPlayer.src = radio.stream;
        audioPlayer.load();
        audioPlayer.play().then(() => {
            currentPlayingIndex = index;
            activeBtn = btnElement;
            updateButtonState(btnElement, true);
            vinylImg.src = radio.logo;
            vinylImg.classList.add('playing');
            currentStationNameSpan.textContent = currentLang === 'tg' ? radio.name_tg : radio.name_ru;
        }).catch(() => {
            showToast(currentLang === 'tg' ? 'Хатогӣ дар пайвастшавӣ' : 'Ошибка подключения');
            updateButtonState(btnElement, false);
            currentPlayingIndex = -1;
            activeBtn = null;
            vinylImg.classList.remove('playing');
            updateVinylAndName();
        });
    }
    
    function updateButtonState(btn, isPlaying) {
        if (!btn) return;
        if (isPlaying) {
            btn.innerHTML = `<i class="fas fa-pause"></i> ${currentLang === 'tg' ? 'Таваққуф' : 'Пауза'}`;
            btn.classList.add('playing');
        } else {
            btn.innerHTML = `<i class="fas fa-play"></i> ${currentLang === 'tg' ? 'Гӯш кардан' : 'Слушать'}`;
            btn.classList.remove('playing');
        }
    }
    
    // Рекламный слайдер
    function renderAdSlider() {
        const slidesContainer = document.getElementById('adSlides');
        const dotsContainer = document.getElementById('adDots');
        slidesContainer.innerHTML = '';
        dotsContainer.innerHTML = '';
        ADS.forEach((ad, i) => {
            const slide = document.createElement('div');
            slide.className = 'ad-slide';
            slide.style.backgroundImage = `url('${ad.image}')`;
            slide.style.backgroundSize = 'cover';
            slide.style.backgroundPosition = 'center';
            slide.innerHTML = `<div class="ad-content"><div>${ad.text}</div><button class="ad-order-btn" data-ad-index="${i}">Заказать</button></div>`;
            slidesContainer.appendChild(slide);
            const dot = document.createElement('div');
            dot.className = 'dot';
            if (i === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToAdSlide(i));
            dotsContainer.appendChild(dot);
        });
        document.querySelectorAll('.ad-order-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                window.open(TELEGRAM_SUPPORT, '_blank');
            });
        });
        updateAdSlider();
    }
    
    function updateAdSlider() {
        const slides = document.querySelectorAll('.ad-slide');
        const dots = document.querySelectorAll('.dot');
        const container = document.querySelector('.ad-slides');
        if (!container || slides.length === 0) return;
        container.style.transform = `translateX(-${currentAdSlide * 100}%)`;
        slides.forEach((slide, i) => {
            slide.style.flex = '0 0 100%';
        });
        dots.forEach((dot, i) => {
            dot.classList.toggle('active', i === currentAdSlide);
        });
    }
    
    function goToAdSlide(index) {
        currentAdSlide = index;
        updateAdSlider();
    }
    
    function startAdAutoPlay() {
        setInterval(() => {
            currentAdSlide = (currentAdSlide + 1) % ADS.length;
            updateAdSlider();
        }, 5000);
    }
    
    // Курс валют (исправленный)
    async function fetchCurrency() {
        try {
            const response = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
            const data = await response.json();
            const usdToTjs = data.usd.tjs || 10.95;
            const eurToTjs = usdToTjs * 1.08;
            const rubToTjs = usdToTjs * 0.012;
            document.getElementById('usdRate').innerText = Math.round(usdToTjs * 100);
            document.getElementById('eurRate').innerText = Math.round(eurToTjs * 100);
            document.getElementById('rubRate').innerText = Math.round(rubToTjs * 1000);
        } catch (e) {
            document.getElementById('usdRate').innerText = '1095';
            document.getElementById('eurRate').innerText = '1182';
            document.getElementById('rubRate').innerText = '130';
        }
    }
    
    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    
    function setupMenu() {
        const menuBtn = document.getElementById('menuBtn');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');
        menuBtn.onclick = () => { sideMenu.classList.add('active'); overlay.classList.add('active'); };
        overlay.onclick = () => { sideMenu.classList.remove('active'); overlay.classList.remove('active'); };
        document.getElementById('menuHome').onclick = () => { sideMenu.classList.remove('active'); overlay.classList.remove('active'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        document.getElementById('menuSuggest').onclick = () => { sideMenu.classList.remove('active'); overlay.classList.remove('active'); window.open(TELEGRAM_SUPPORT, '_blank'); };
        document.getElementById('menuLang').onclick = () => { sideMenu.classList.remove('active'); overlay.classList.remove('active'); setLanguage(currentLang === 'tg' ? 'ru' : 'tg'); };
        document.getElementById('menuShare').onclick = () => { sideMenu.classList.remove('active'); overlay.classList.remove('active'); if (navigator.share) navigator.share({ title: APP_NAME, url: window.location.href }); else { navigator.clipboard.writeText(window.location.href); showToast(currentLang === 'tg' ? 'Истинод нусхабардорӣ шуд' : 'Ссылка скопирована'); } };
        document.getElementById('menuRate').onclick = () => { sideMenu.classList.remove('active'); overlay.classList.remove('active'); showToast(currentLang === 'tg' ? 'Баҳодиҳӣ дар Play Market' : 'Оцените в Play Market'); };
        document.getElementById('menuAbout').onclick = () => { sideMenu.classList.remove('active'); overlay.classList.remove('active'); showToast(`${APP_NAME} | Версия 2.0 | Kurush Digital`); };
        document.getElementById('menuSupport').onclick = () => { sideMenu.classList.remove('active'); overlay.classList.remove('active'); window.open(TELEGRAM_SUPPORT, '_blank'); };
        document.getElementById('suggestBtn').onclick = () => window.open(TELEGRAM_SUPPORT, '_blank');
        document.getElementById('socialTelegram').href = SOCIAL.telegram;
        document.getElementById('socialInstagram').href = SOCIAL.instagram;
        document.getElementById('socialYoutube').href = SOCIAL.youtube;
        document.getElementById('logoImg').src = LOGO_URL;
        document.getElementById('appTitle').textContent = APP_NAME;
    }
    
    function init() {
        renderRadioList();
        renderAdSlider();
        startAdAutoPlay();
        fetchCurrency();
        setupMenu();
        setInterval(fetchCurrency, 3600000);
        setLanguage('tg');
    }
    init();
</script>
</body>
</html>
